      <span class="lg"><i style="background:var(--mist-soft);border:1px solid var(--mist)"></i>易孕期</span>
      <span class="lg"><i style="background:var(--lavender-soft);border:1px solid var(--lavender)"></i>排卵日</span>
      <span class="lg"><i style="background:var(--pink-soft);border:1px solid var(--bean-line)"></i>黄体期</span>
    </div>
    <div style="font-size:11px;color:var(--text-faint);margin-top:8px;text-align:center">点击日期即可标记 / 取消经期开始</div>
  </div>`;

  // 记录今天（弹窗式入口，不占页面空间）
  const todayRec = hSymptoms()[todayKey()] || {};
  const hasToday = Object.keys(todayRec).length > 0;
  const recBtn = `<button class="hdr-btn" onclick="openDayRecord('${todayKey()}')">
    <span class="hdr-btn-t">${hasToday ? '今日已记录 · 点此修改' : '＋ 记录今天'}</span>
    <span class="hdr-btn-s">经量 / 症状 / 备注</span>
  </button>`;

  // 每日调理建议（按周期第 N 天，放在月历下方）
  const advice = getDailyAdvice();
  const adviceHtml = advice ? `<div class="hp-advice">
    <div class="hpa-head">今日调理 · <span class="hpa-badge">${advice.label}</span></div>
    <div class="hpa-intro">${advice.intro}</div>
    ${advice.items.map(it => `
      <div class="hpa-item">
        <div class="hpa-it"><span class="hpa-cat">${it.cat}</span>${it.t}</div>
        <div class="hpa-why">${it.why}</div>
        <div class="hpa-src">来源：${it.src}</div>
      </div>`).join('')}
    <div class="hpa-note">建议仅供参考，不构成医疗诊断；如有不适请咨询专业医生</div>
  </div>` : '';

  return mainCard + cal + adviceHtml + recBtn + healthTrendHtml() + healthTipsHtml();
}

/* ---------- 每日记录 ---------- */
function dayRecordHtml(rec, k) {
  const on = key => !!rec[key];
  const levelOn = (key, lv) => rec[key] === lv;
  const isToday = k === todayKey();
  return `<div class="hdr">
    <div class="hdr-title">${isToday ? '记录今天' : fmtMD(k) + ' 的记录'}</div>
    ${isToday ? `<div class="form-row"><label class="form-label">经量</label>
      <div class="chips">${FLOW_LEVELS.map(l => `<button class="chip ${levelOn('flow', l.id) ? 'on' : ''}" onclick="toggleFlow('${l.id}')">${l.name}</button>`).join('')}</div></div>` : ''}
    <div class="hdr-grid">
      ${SYMPTOM_DEFS.map(s => {
        if (s.key === 'pain' && !isToday) return '';
        return `<button class="sym-btn ${on(s.key) ? 'on' : ''}" data-key="${s.key}" onclick="toggleSym('${s.key}')">
          <span>${s.name}</span>${s.level && isToday ? `<i class="sym-lv">${rec[s.key] ? PAIN_LEVELS.find(x => x.id === rec[s.key]).name : ''}</i>` : ''}
        </button>`;
      }).join('')}
    </div>
    ${isToday ? `<div class="form-row"><label class="form-label">其他备注</label>
      <input class="in" id="symNote" value="${esc(rec.note || '')}" placeholder="可记录情绪、身体状况等" maxlength="60"></div>` : ''}
  </div>`;
}
function openDayRecord(k) {
  const sym = hSymptoms();
  const rec = sym[k] || {};
  openSheet(`<div class="sheet-title">${fmtMD(k)} 的记录${k !== todayKey() ? '（历史补记）' : ''}</div>
    ${dayRecordHtml(rec, k)}
    <div class="form-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="saveSym('${k}')">保存</button>
    </div>`);
}
function toggleFlow(lv) {
  const sym = hSymptoms();
  const rec = sym[todayKey()] = sym[todayKey()] || {};
  rec.flow = rec.flow === lv ? '' : lv;
  const sheet = document.querySelector('.sheet');
  if (sheet) {
    // 弹窗内局部刷新经量 chips
    sheet.querySelectorAll('.chips .chip').forEach(c => {
      const target = FLOW_LEVELS.find(x => x.name === c.textContent.trim());
      c.classList.toggle('on', target ? rec.flow === target.id : false);
    });
  } else renderHealth();
}
function toggleSym(key) {
  const sym = hSymptoms();
  const rec = sym[todayKey()] = sym[todayKey()] || {};
  const def = SYMPTOM_DEFS.find(s => s.key === key);
  if (def && def.level) {
    const cur = rec[key];
    const levels = def.level.map((_, i) => PAIN_LEVELS[i].id);
    const idx = levels.indexOf(cur);
    rec[key] = idx === -1 ? levels[0] : (idx + 1 < levels.length ? levels[idx + 1] : '');
  } else {
    rec[key] = rec[key] ? '' : true;
  }
  const sheet = document.querySelector('.sheet');
  if (sheet) {
    // 弹窗内局部刷新按钮状态
    const btn = sheet.querySelector(`.sym-btn[data-key="${key}"]`);
    if (btn) {
      btn.classList.toggle('on', !!rec[key]);
      const lv = btn.querySelector('.sym-lv');
      if (lv && def && def.level) {
        const name = rec[key] ? ((PAIN_LEVELS.find(x => x.id === rec[key]) || {}).name || '') : '';
        lv.textContent = name;
      }
    }
  } else {
    renderHealth();
  }
}
function saveSym(k) {
  const sym = hSymptoms();
  const rec = sym[k] = sym[k] || {};
  const note = document.getElementById('symNote');
  if (note) rec.note = note.value.trim();
  saveData(); closeSheet(); renderHealth();
  showToast('已保存');
}

/* ---------- 基础记录 ---------- */
function healthBaseHtml() {
  const c = healthCfg();
  const list = c.periods.slice().sort((a, b) => a.start > b.start ? -1 : 1);
  return `<div class="card" style="padding:16px">
    <div class="form-row"><label class="form-label">初次月经日期（可选）</label>
      <input class="in" type="date" id="hFirst" value="${esc(data.health.firstPeriodStart || '')}"></div>
    <div class="form-row"><label class="form-label">最近一次经期开始日期 <b style="color:var(--bean)">*</b></label>
      <input class="in" type="date" id="hLast" value="${esc(c.lastStart)}"></div>
    <div class="form-row"><label class="form-label">平均月经周期（天，默认 28）</label>
      <input class="in" type="number" id="hCycle" value="${c.cycle}" min="15" max="60" inputmode="numeric"></div>
    <div class="form-row"><label class="form-label">经期持续时间（天，默认 5）</label>
      <input class="in" type="number" id="hPeriod" value="${c.period}" min="1" max="15" inputmode="numeric"></div>
    <div style="font-size:11.5px;color:var(--text-faint);line-height:1.7;margin-bottom:10px">月经周期从一次月经出血的第一天，计算至下一次月经开始前一天。<br>周期常见范围为 21~35 天，个体差异属正常现象，本工具不作疾病判断。</div>
    <div class="form-actions">
      <button class="btn ghost" onclick="recordPeriodQuick()">记录经期</button>
      <button class="btn" onclick="saveHealthBase(true)">保存并查看预测</button>
    </div>
  </div>
  <div class="hb-section">经期记录历史（${list.length} 次）</div>
  <div class="hplist">
    ${list.length ? list.map(p => `<div class="hplist-item"><span>${fmtMD(p.start)} ~ ${fmtMD(p.end)}</span>
      <button class="icon-btn" style="width:44px;height:44px;color:var(--text-faint)" onclick="delPeriod('${p.start}')">${SVG_TRASH}</button></div>`).join('')
      : '<div class="empty" style="padding:18px">还没有经期记录</div>'}
  </div>`;
}
function recordPeriodQuick() {
  const c = healthCfg();
  const defStart = c.lastStart ? dateKey(addDays(parseKey(c.lastStart), c.cycle)) : todayKey();
  openSheet(`<div class="sheet-title">记录经期</div>
    <div class="form-row"><label class="form-label">开始日期</label>
      <input class="in" type="date" id="pdStart" value="${esc(defStart)}"></div>
    <div class="form-row"><label class="form-label">结束日期</label>
      <input class="in" type="date" id="pdEnd" value="${esc(dateKey(addDays(parseKey(defStart), c.period - 1)))}"></div>
    <div class="form-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="savePeriod()">保存</button>
    </div>`);
}
function savePeriod() {
  const s = document.getElementById('pdStart').value;
  const e = document.getElementById('pdEnd').value;
  if (!s) { showToast('请选择开始日期'); return; }
  const end = (e && e >= s) ? e : dateKey(addDays(parseKey(s), (data.health.periodLen || 5) - 1));
  const periods = hPeriods().filter(p => p.start !== s);
  periods.push({ start: s, end });
  periods.sort((a, b) => a.start > b.start ? -1 : 1);
  data.health.periods = periods;
  if (!data.health.lastPeriodStart || s > data.health.lastPeriodStart) data.health.lastPeriodStart = s;
  saveData(); closeSheet(); renderHealth();
  showToast('已记录');
}
function delPeriod(s) {
  data.health.periods = hPeriods().filter(p => p.start !== s);
  saveData(); renderHealth();
}
function saveHealthBase(gotoPred) {
  const last = document.getElementById('hLast').value;
  const cyc = parseInt(document.getElementById('hCycle').value, 10);
  const per = parseInt(document.getElementById('hPeriod').value, 10);
  const first = document.getElementById('hFirst').value;
  if (!last) { showToast('请填写最近一次经期开始日期'); return; }
  if (!cyc || cyc < 15 || cyc > 60) { showToast('周期建议填 15~60 天之间的数值'); return; }
  if (!per || per < 1 || per > 15) { showToast('经期长度建议填 1~15 天之间的数值'); return; }
  data.health = data.health || {};
  data.health.lastPeriodStart = last;
  data.health.cycleLen = cyc;
  data.health.periodLen = per;
  data.health.firstPeriodStart = first;
  // 若该开始日期不在历史中，追加
  if (!hPeriods().some(p => p.start === last)) {
    data.health.periods.push({ start: last, end: dateKey(addDays(parseKey(last), per - 1)) });
    data.health.periods.sort((a, b) => a.start > b.start ? -1 : 1);
  }
  saveData();
  showToast('已保存');
  if (gotoPred) setHealthTab('pred');
}

/* ---------- 周期趋势 ---------- */
function healthTrendHtml() {
  const ps = hPeriods().slice().sort((a, b) => a.start < b.start ? -1 : 1);
  const cycles = [];
  for (let i = 1; i < ps.length; i++) {
    const len = daysBetween(parseKey(ps[i - 1].start), parseKey(ps[i].start));
    if (len >= 10 && len <= 90) cycles.push(len);
  }
  const recent = cycles.slice(-6);
  if (!recent.length) {
    return `<div class="hb-section">周期趋势</div>
      <div class="card" style="padding:16px">
        <div style="font-size:12.5px;color:var(--text-faint);line-height:1.8">记录 2 次以上经期后，这里会展示最近 6 个周期的长度变化。<br>当前为演示数据示例：下图展示的是示例周期。</div>
        ${demoTrendSvg()}
      </div>`;
  }
  const avg = Math.round(recent.reduce((a, b) => a + b, 0) / recent.length);
  const min = Math.min(...recent), max = Math.max(...recent);
  const span = max - min;
  const wave = span > 3 ? '存在一定波动' : '较为稳定';
  const W = 280, H = 60, pad = 6;
  const step = (W - pad * 2) / Math.max(1, recent.length - 1);
  const minV = Math.min(...recent) - 1, maxV = Math.max(...recent) + 1;
  const pts = recent.map((v, i) => `${(pad + i * step).toFixed(1)},${(H - pad - (v - minV) / (maxV - minV) * (H - pad * 2)).toFixed(1)}`).join(' ');
  const lastIdx = recent.length - 1;
  return `<div class="hb-section">周期趋势</div>
    <div class="card" style="padding:16px">
      <div class="ht-top">
        <div class="ht-item"><b>${avg}</b>天<br>平均周期</div>
        <div class="ht-item"><b>${min}</b>天<br>最短</div>
        <div class="ht-item"><b>${max}</b>天<br>最长</div>
        <div class="ht-item"><b>${wave}</b><br>波动</div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:64px;margin:8px 0">
        <polyline points="${pts}" fill="none" stroke="var(--bean)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${recent.map((v, i) => `<circle cx="${pad + i * step}" cy="${(H - pad - (v - minV) / (maxV - minV) * (H - pad * 2)).toFixed(1)}" r="${i === lastIdx ? 3.5 : 2.5}" fill="${i === lastIdx ? 'var(--bean-deep)' : 'var(--bean)'}"/>`).join('')}
      </svg>
      <div style="font-size:11px;color:var(--text-faint);text-align:center">最近 ${recent.length} 个周期长度（天）· 仅作数据展示，不构成诊断</div>
    </div>`;
}
function demoTrendSvg() {
  const vals = [29, 31, 28, 30, 28];
  const W = 280, H = 60, pad = 6;
  const step = (W - pad * 2) / Math.max(1, vals.length - 1);
  const pts = vals.map((v, i) => `${(pad + i * step).toFixed(1)},${(H - pad - (v - 26) / 8 * (H - pad * 2)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:64px;margin:8px 0;opacity:.5">
    <polyline points="${pts}" fill="none" stroke="var(--bean)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ---------- 健康提示 ---------- */
function healthTipsHtml() {
  return `<div class="hp-tips">
    <div class="hpt">周期、易孕期和排卵日期均为<b>估算</b>，实际时间可能因压力、睡眠、疾病、用药、激素和生活变化而不同。请勿将本预测作为避孕依据或医学诊断。</div>
    <div class="hpt">如果出现持续异常出血、严重疼痛、连续多次月经缺失或其他担忧，请咨询专业医疗人员。</div>
  </div>`;
}

/* 月历切月 */
function hcalMove(n) {
  const [y, m] = (state.hcalMonth || todayKey().slice(0, 7)).split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  state.hcalMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  renderHealth();
}
function hcalToday() {
  state.hcalMonth = todayKey().slice(0, 7);
  renderHealth();
}

</script>
</body>
