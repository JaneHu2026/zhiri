<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7F2">
<meta name="description" content="知日 · 个人工作台（待办 / 记账 / 新闻 / 学习 / 专注）">
<title>知日 · 个人工作台</title>
<style>
/* ============ 设计系统 ============ */
:root{
  --bg:#F8F7F2;            /* 页面背景（暖米白） */
  --surface:#FFFFFF;       /* 卡片表面 */
  --card:#FFFFFF;
  --text:#272C28;          /* 主文字 */
  --text-dim:#7B827C;      /* 次级文字 */
  --text-faint:#A9B0A9;    /* 弱化文字 */
  --green:#557263;         /* 主绿色 */
  --green-deep:#344F42;    /* 深绿色 */
  --green-soft:#E7EDE8;    /* 绿色浅底 */
  --on-green:#FFFFFF;      /* 绿底上的文字 */
  --line:#E6E5DE;          /* 分隔线 */
  --line-soft:#EFEEE8;
  --apricot:#D9B581;       /* 杏色点缀 */
  --apricot-soft:#F5EBD9;
  --lavender:#8E88B5;      /* 低饱和紫 */
  --lavender-soft:#ECEAF4;
  --mist:#7FA3B5;          /* 雾蓝 */
  --mist-soft:#E4EDF2;
  --danger:#B8554A;        /* 支出/删除（砖红，低饱和） */
  --danger-soft:#F6E7E4;
  --income:#4E7A63;        /* 收入绿 */
  --income-soft:#E6EDE9;
  --shadow:0 2px 12px rgba(52,79,66,.07);
  --shadow-lg:0 8px 30px rgba(52,79,66,.14);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:9px;
  --font-serif:'Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --nav-h:60px;
}
[data-theme="dark"]{
  --bg:#1E221F; --surface:#262B27; --card:#2A302B;
  --text:#E6E4DC; --text-dim:#9AA39B; --text-faint:#6F776F;
  --green:#7FA08D; --green-deep:#C2D5C9; --green-soft:#303B34;
  --on-green:#1E221F;
  --line:#3A413B; --line-soft:#333A34;
  --apricot:#CDAC7C; --apricot-soft:#3B352A;
  --lavender:#A69FD3; --lavender-soft:#302E3C;
  --mist:#8FB4C7; --mist-soft:#2B373E;
  --danger:#D07A6E; --danger-soft:#3B2B28;
  --income:#8FB89F; --income-soft:#29372F;
  --shadow:0 2px 12px rgba(0,0,0,.28);
  --shadow-lg:0 8px 30px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
@media(min-width:560px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:var(--shadow-lg)}
}
/* ============ 顶栏 ============ */
.app-header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.hd-left{min-width:0}
.hd-date{font-size:12.5px;color:var(--text-dim);line-height:1.5}
.hd-date b{font-size:15px;color:var(--text);font-weight:600;font-family:var(--font-serif);margin-right:2px}
.hd-right{display:flex;gap:8px;align-items:center}
.avatar{
  width:44px;height:44px;min-width:44px;border-radius:50%;
  background:var(--green-deep);color:var(--on-green);
  font-family:var(--font-serif);font-size:19px;font-weight:600;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.icon-btn{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  transition:transform .12s;
}
.icon-btn:active{transform:scale(.93)}
/* ============ 演示数据横幅 ============ */
.demo-banner{
  display:flex;align-items:center;gap:8px;
  margin:12px 16px 0;padding:8px 12px;border-radius:12px;
  background:var(--apricot-soft);border:1px solid color-mix(in srgb,var(--apricot) 45%,transparent);
  font-size:12.5px;color:var(--text-dim);
}
.demo-banner b{color:var(--apricot);font-weight:700}
.demo-banner .db-x{margin-left:auto;width:44px;height:44px;min-width:44px;border-radius:12px;font-size:14px;color:var(--text-dim)}
/* ============ 页签摘要区（小字 + 大字标题） ============ */
.tab-hero{margin:2px 2px 14px}
.th-sub{font-size:12.5px;color:var(--text-dim);letter-spacing:.06em}
.th-main{font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--green-deep);margin-top:3px;line-height:1.3}
/* ============ 主区与页签 ============ */
main{padding:14px 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 12px}
.sec-title{font-family:var(--font-serif);font-size:20px;font-weight:600;color:var(--green-deep)}
.sec-sub{font-size:12px;color:var(--text-dim)}
/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.chip{
  flex:none;min-height:44px;padding:0 18px;border-radius:22px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  transition:all .15s;
}
.chip.on{background:var(--green-deep);border-color:var(--green-deep);color:var(--on-green);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.seg{display:flex;background:var(--line-soft);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{
  flex:1;min-height:44px;border-radius:11px;font-size:14px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.seg button.on{background:var(--card);color:var(--green-deep);font-weight:600;box-shadow:var(--shadow)}
.btn{
  min-height:44px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--green-deep);color:var(--on-green);transition:transform .12s;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text-dim)}
.btn.warn{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.btn.block{width:100%}
input.in,select.in,textarea.in{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;outline:none;transition:border-color .15s;
}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--green)}
input.in::placeholder,textarea.in::placeholder{color:var(--text-faint)}
.fab{
  position:fixed;z-index:25;right:max(18px,calc(50% - 244px));
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;color:var(--on-green);
  background:var(--green-deep);box-shadow:0 6px 20px rgba(52,79,66,.35);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}
.empty{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;line-height:2}
.empty .e-ico{font-size:34px;display:block;margin-bottom:6px}
/* ============ 底部导航 ============ */
.bottom-nav{
  position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:var(--surface);border-top:1px solid var(--line);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--text-dim);min-height:44px;
}
.nav-item .ni-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.nav-item .ni-ico svg{width:22px;height:22px;display:block}
[data-theme="dark"] .ic-moon{display:none}
[data-theme="light"] .ic-sun{display:none}
.nav-item.on{color:var(--green-deep);font-weight:600}
.nav-item.on .ni-ico{transform:translateY(-1px) scale(1.08)}
.nav-item .ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px}
.nav-item.on .ni-dot{opacity:1}
/* ============ 待办 ============ */
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.ds-item{
  flex:none;width:52px;min-height:60px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
}
.ds-item .ds-w{font-size:11px}
.ds-item .ds-d{font-size:16px;font-weight:600;color:var(--text)}
.ds-item.is-today{border-color:var(--green)}
.ds-item.on{background:var(--green-deep);border-color:var(--green-deep)}
.ds-item.on .ds-w,.ds-item.on .ds-d{color:var(--on-green)}
.todo-progress{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.tp-text{font-size:13px;color:var(--text-dim);white-space:nowrap}
.tp-text b{color:var(--green-deep);font-size:14px}
.tp-bar{flex:1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.tp-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item-wrap{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.todo-item{
  display:flex;align-items:center;gap:2px;padding:6px 8px;
  background:var(--card);position:relative;z-index:2;
  touch-action:pan-y;transition:transform .18s ease;
}
.todo-item.swiping{transition:none}
.todo-item.dragging{opacity:.6;box-shadow:var(--shadow-lg);z-index:5;position:relative}
.todo-item.done .td-text{text-decoration:line-through;color:var(--text-faint)}
.todo-swipe{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1}
.tsw-btn{
  width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:#fff;
}
.tsw-btn svg{width:19px;height:19px}
.tsw-edit{background:var(--green)}
.tsw-del{background:var(--danger)}
.swipe-hint{font-size:11.5px;color:var(--text-faint);text-align:right;margin:-4px 4px 8px}
.grip{
  width:38px;height:44px;min-width:38px;display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:13px;letter-spacing:-2px;touch-action:none;cursor:grab;
}
.check{
  width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;
}
.ck-circle{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--on-green);
  transition:all .15s;background:transparent;
}
.check.on .ck-circle{background:var(--green);border-color:var(--green)}
.td-main{flex:1;min-width:0;padding:4px 4px}
.td-text{font-size:14.5px;word-break:break-all;transition:color .15s}
.td-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag-pill{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:500}
.tag-work{background:var(--green-soft);color:var(--green-deep)}
.tag-life{background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 75%,var(--text))}
.due-txt{font-size:11px;color:var(--text-faint)}
.due-txt.soon{color:var(--danger)}
.td-actions{display:flex}
.td-actions .icon-btn{width:44px;min-width:44px;height:44px;min-height:44px;font-size:15px;border:none;background:transparent}
.td-actions .icon-btn.warn{color:var(--danger)}
/* ============ 记账 ============ */
.acct-summary{
  display:flex;align-items:stretch;margin-bottom:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.acct-summary .as-col{flex:1;padding:14px 10px;text-align:center;min-width:0}
.acct-summary .as-col+.as-col{border-left:1px solid var(--line-soft)}
.acct-summary .as-label{font-size:11.5px;color:var(--text-dim);margin-bottom:4px}
.acct-summary .as-val{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-summary .income .as-val{color:var(--income)}
.acct-summary .expense .as-val{color:var(--danger)}
.acct-summary .balance .as-val{color:var(--green-deep)}
.acct-balance{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--green-deep);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;color:var(--on-green);box-shadow:var(--shadow);
}
.acct-balance .ab-label{font-size:13px;opacity:.8}
.acct-balance .ab-val{font-size:26px;font-weight:700;font-family:var(--font-serif);word-break:break-all;text-align:right}
.acct-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.acct-two .at-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 15px}
.at-card .at-label{font-size:11.5px;color:var(--text-dim);margin-bottom:3px}
.at-card .at-val{font-size:19px;font-weight:700;word-break:break-all}
.at-card.income .at-val{color:var(--income)}
.at-card.expense .at-val{color:var(--danger)}
.acct-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.acct-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 12px}
.acct-card .ac-label{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.acct-card .ac-val{font-size:16.5px;font-weight:700;word-break:break-all}
.acct-card.income .ac-val{color:var(--income)}
.acct-card.expense .ac-val{color:var(--danger)}
.acct-card.balance .ac-val{color:var(--green-deep)}
.acct-ops{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.acct-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.acct-day{border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.acct-day-head{display:flex;justify-content:space-between;padding:9px 14px;font-size:12.5px;color:var(--text-dim);background:var(--green-soft);border-bottom:1px solid var(--line-soft)}
.acct-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.acct-row:last-child{border-bottom:none}
.acct-row:active{background:var(--line-soft)}
.ac-ico{width:38px;height:38px;min-width:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--line-soft)}
.ac-ico.income{background:var(--income-soft)}
.ac-ico.expense{background:var(--danger-soft)}
.ac-info{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:500}
.ac-note{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-amt{font-size:14.5px;font-weight:700;white-space:nowrap}
.ac-amt.income{color:var(--income)}
.ac-amt.expense{color:var(--danger)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cat-bar-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.cbr-ico{width:26px;min-width:26px;font-size:15px;text-align:center}
.cbr-name{width:64px;min-width:64px;font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbr-track{flex:1;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.cbr-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.cbr-fill.expense{background:var(--danger)}
.cbr-fill.income{background:var(--income)}
.cbr-pct{width:38px;min-width:38px;text-align:right;font-size:12px;color:var(--text-dim)}
.cbr-amt{width:66px;min-width:66px;text-align:right;font-size:12px;font-weight:600}
.chart-box{width:100%;overflow-x:auto}
/* ============ 新闻 ============ */
.news-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.news-item{display:block;text-decoration:none;color:inherit;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.news-item:active{background:var(--line-soft)}
.ns-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ns-theme{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--green-soft);color:var(--green-deep);font-weight:600}
.ns-theme.gj{background:var(--mist-soft);color:color-mix(in srgb,var(--mist) 80%,var(--text))}
.ns-title{font-family:var(--font-serif);font-size:16px;font-weight:600;line-height:1.5;margin-bottom:6px}
.ns-sum{font-size:13px;color:var(--text-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.ns-foot{font-size:11.5px;color:var(--text-faint);display:flex;gap:10px}
.ns-dedup{color:var(--apricot)}
/* ============ 学习 ============ */
.study-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.study-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sc-top{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.sc-platform{font-size:11px;padding:2px 9px;border-radius:8px;font-weight:700;color:var(--on-green)}
.pl-youtube{background:#C0392B}
.pl-tiktok{background:#111;border:1px solid #555}
.pl-douyin{background:#2B2B33}
.pl-xhs{background:#B8554A}
.pl-bilibili{background:#E6878A;color:#fff}
.pl-facebook{background:#3B5B93}
.pl-x{background:#1B1B1F;border:1px solid #444}
.sc-heat{margin-left:auto;font-size:11.5px;color:var(--text-dim)}
.sc-net{font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 80%,var(--text))}
.sc-title{font-family:var(--font-serif);font-size:15.5px;font-weight:600;line-height:1.5;padding:8px 14px 4px;cursor:pointer;display:block;text-decoration:none;color:inherit}
.sc-title:active{color:var(--green)}
.sc-meta{font-size:11.5px;color:var(--text-faint);padding:0 14px 8px;display:flex;gap:8px;flex-wrap:wrap}
.sc-src-note{margin-left:auto;color:var(--apricot)}
.sc-points{margin:0 14px 10px;padding:9px 12px;border-radius:12px;background:var(--green-soft);font-size:12.5px;line-height:1.75;color:var(--text-dim)}
.sc-points b{color:var(--green-deep);font-weight:700}
.sc-points li{margin-left:16px}
.sc-actions{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line-soft);padding:4px 6px}
.sc-actions .icon-btn{width:44px;min-width:44px;height:44px;min-height:44px;font-size:16px;border:none;background:transparent}
.sc-actions .icon-btn.on-fav{color:var(--apricot)}
.sc-actions .icon-btn.on-watched{color:var(--green)}
.sc-actions .icon-btn.on-later{color:var(--mist)}
.sc-actions .icon-btn.on-fav svg,.sc-actions .icon-btn.on-watched svg,.sc-actions .icon-btn.on-later svg{fill:currentColor}
.sc-go{margin-left:auto;font-size:12.5px;color:var(--green-deep);font-weight:600;padding:0 12px;min-height:44px;display:flex;align-items:center;gap:4px}
/* ============ 专注 ============ */
.focus-summary{background:var(--green-deep);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;color:var(--on-green)}
.fs-label{font-size:12.5px;opacity:.75;margin-bottom:2px}
.fs-val{font-size:30px;font-weight:700;font-family:var(--font-serif)}
.fs-note{font-size:11.5px;opacity:.7;margin-top:3px}
.focus-list{display:flex;flex-direction:column;gap:10px}
.focus-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px}
.focus-card.running{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.fc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fc-name{font-size:15.5px;font-weight:600;font-family:var(--font-serif)}
.fc-goal{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 75%,var(--text))}
.fc-done{margin-left:auto;font-size:12px;color:var(--green);font-weight:700}
.fc-timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 8px;color:var(--green-deep)}
.focus-card.running .fc-timer{font-size:44px;line-height:1.2;margin:6px 0 12px}
.focus-card.running .fc-timer .pulse{width:12px;height:12px}
.fc-timer .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:8px;vertical-align:2px;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.fc-bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-bottom:8px}
.fc-bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.fc-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);margin-bottom:12px}
.fc-stats b{color:var(--text);font-weight:600}
.fc-ctl{display:flex;gap:8px}
.fc-ctl .btn{flex:1}
.fc-ctl .btn.stop{background:var(--danger);color:#fff}
.fc-ctl .btn.resume{background:var(--green)}
/* ============ 底部弹层/表单 ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(30,34,31,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:51;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  box-shadow:var(--shadow-lg);transition:transform .26s cubic-bezier(.32,.72,.28,1);
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet-title{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:14px;color:var(--green-deep)}
.form-row{margin-bottom:14px}
.form-label{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;display:block}
.form-actions{display:flex;gap:10px;margin-top:18px}
.form-actions .btn{flex:1}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-cell{
  min-height:56px;border-radius:13px;border:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-dim);
}
.cat-cell .cc-ico{font-size:19px;line-height:1}
.cat-cell.on{border-color:var(--green);background:var(--green-soft);color:var(--green-deep);font-weight:600}
.cat-cell.add{border-style:dashed;color:var(--text-faint)}
.mode-pick{display:flex;gap:8px}
.mode-pick .btn{flex:1}
.mode-pick .btn.on{outline:3px solid var(--green-soft)}
.min-chips{display:flex;gap:8px;flex-wrap:wrap}
.min-chips .chip{min-height:44px;padding:0 15px}
/* ============ Toast ============ */
.toast{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  max-width:82%;padding:10px 18px;border-radius:12px;font-size:13.5px;text-align:center;
  background:var(--green-deep);color:var(--on-green);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">

        <svg class="ic-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4L19 19M19 5l-1.6 1.6M6.6 17.4L5 19"/></svg>

  <nav class="bottom-nav">

    <button class="nav-item" data-tab="acct"><span class="ni-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M15 9.8c0-1.6-1.3-2.8-3-2.8s-3 1.2-3 2.8 1.3 2.8 3 2.8 3 1.2 3 2.8-1.3 2.8-3 2.8-3-1.2-3-2.8"/></svg></span><span>记账</span><span class="ni-dot"></span></button>
    <button class="nav-item" data-tab="news"><span class="ni-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h10M7 17h6"/></svg></span><span>新闻</span><span class="ni-dot"></span></button>
    <button class="nav-item" data-tab="study"><span class="ni-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V4H6.5A2.5 2.5 0 004 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></svg></span><span>学习</span><span class="ni-dot"></span></button>
    <button class="nav-item" data-tab="focus"><span class="ni-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span><span>专注</span><span class="ni-dot"></span></button>

</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ============================================================
 * 知日 · 个人工作台  —  第一阶段（演示数据 + 本机持久化）
 * 数据层为可替换接口：第二阶段将换为 IndexedDB 适配器
 * ============================================================ */
'use strict';

/* ---------- 工具函数 ---------- */
const pad2 = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const daysAgo = n => new Date(Date.now() - n * 86400000);
const fmtYMD = k => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const fmtW = d => '周' + '日一二三四五六'[d.getDay()];
const fmtWeekday = k => fmtW(parseKey(k));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtMoney = n => '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtHours = ms => (ms / 3600000).toFixed(1) + ' 小时';
const fmtClock = ms => {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? `${h}:${pad2(m)}:${pad2(ss)}` : `${pad2(m)}:${pad2(ss)}`;
};
const fmtHeat = n => n >= 10000 ? (n / 10000).toFixed(n >= 1000000 ? 0 : 1) + '万' : String(n);
const fmtUpdated = iso => {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return Math.floor(diff / 86400000) + '天前';
};
const isToday = k => k === todayKey();

/* ---------- 状态 ---------- */
const state = {
  tab: 'todo',
  todoDate: todayKey(),
  todoFilter: 'all',           // all | work | life
  acctRange: 'month',        // month | year | custom
  acctStart: '', acctEnd: '',
  acctFilter: 'all',         // all | income | expense
  acctGran: 'month',         // day | month | quarter | year
  newsGroup: 'all',          // all | gn | gj
  newsTheme: 'all',
  studyFilter: 'all',        // all | youtube | tiktok | douyin | xhs
  focusPeriod: 'today',      // today | week | month | all
  focusRunning: null,        // 进行中的专注会话（时间戳恢复）
  drag: null,
};

/* ============================================================
 * 外部内容源：复用工作台 GitHub Actions 每日抓取的数据
 * （工作台与知日同域 janehu2026.github.io，前端直接读取）
 * ============================================================ */
const EXT_BASE = 'https://janehu2026.github.io/zhiri/';
const THEME_KW = [
  ['民生', /医保|养老|社保|补贴|菜价|消费品|生活|供水|供电|出行|民生/],
  ['政策', /政策|文件|发布|印发|规定|措施|条例|部署|意见/],
  ['财经', /经济|金融|央行|利率|财政|市场|物价|就业|外贸|增长|关税/],
  ['科技', /科技|AI|人工智能|航天|芯片|机器人|卫星|量子|算力|模型/],
  ['医疗', /医疗|医保|医院|药品|健康|疾病|疫苗|门诊|卫生/],
  ['社会', /社会|社区|改造|救援|通报|服务|保障|志愿者/],
  ['环境', /环境|生态|气候|天气|高温|能源|台风|洪水|污染|排放/],
  ['教育', /教育|学校|学生|高考|教师|教材|课程|大学/],
  ['文化', /文化|电影|作家|艺术|音乐|出版/],
  ['体育', /体育|奥运|足球|比赛|联赛/],
];
function guessTheme(title) {
  for (const [name, re] of THEME_KW) { if (re.test(title)) return name; }
  return '要闻';
}
function dayLabel(day) {
  if (day <= 0) return '今天';
  if (day === 1) return '昨天';
  return day + '天前';
}
function convertNews(n) {
  const out = [];
  const now = new Date();
  (n.items || []).forEach(g => {
    const group = (g.cat === 'gj') ? 'gj' : 'gn';
    (g.items || []).forEach(it => {
      const t = (it.title || '').trim();
      if (!t) return;
      let day = 9;
      if (it.pubDate) {
        const d = new Date(it.pubDate);
        if (!isNaN(d.getTime())) day = Math.max(0, Math.floor((now.getTime() - d.getTime()) / 86400000));
      }
      out.push({
        id: uid('ns'), group, theme: guessTheme(t), title: t,
        source: it.source || '', time: dayLabel(day), url: it.link || '#',
        summary: it.desc || '（点击查看原文）', day,
      });
    });
  });
  out.sort((a, b) => a.day - b.day);
  return { fetchedAt: n.fetchedAt || '08:00', fetchedDate: n.fetchedDate || todayKey(), items: out.slice(0, 40) };
}
function convertStudy(s) {
  const MAP = [
    [/YouTube/i, 'youtube'], [/B站|bilibili/i, 'bilibili'], [/小红书|XHS/i, 'xhs'],
    [/抖音/i, 'douyin'], [/TikTok/i, 'tiktok'], [/Facebook/i, 'facebook'], [/Twitter|\bX\b/i, 'x'],
  ];
  const out = [];
  (s.items || []).forEach(g => {
    let platform = 'douyin';
    for (const [re, p] of MAP) { if (re.test(g.label || '')) { platform = p; break; } }
    (g.items || []).forEach(it => {
      const t = (it.title || '').trim();
      if (!t) return;
      out.push({
        id: uid('sv'), platform, author: it.source || '', title: t,
        duration: it.duration || '—', heat: it.heat || 0,
        updated: new Date((s.fetchedDate || todayKey()) + 'T08:00:00').toISOString(),
        url: it.link || '#', points: [], flags: { fav: false, watched: false, later: false },
      });
    });
  });
  return out.slice(0, 30);
}
async function loadExternalFeed() {
  if (IS_DEMO) return;
  try {
    const [n, s] = await Promise.all([
      fetch(EXT_BASE + 'news.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(EXT_BASE + 'study.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    let changed = false;
    if (n && n.items && n.items.length) {
      // 知日原生格式（group/theme/...）直接用；旧格式走转换
      if (n.items[0].group) {
        data.news = { fetchedAt: n.fetchedAt || '08:00', fetchedDate: n.fetchedDate || todayKey(), items: n.items.slice(0, 40) };
      } else {
        data.news = convertNews(n);
      }
      changed = true;
    }
    if (s && s.items && s.items.length) {
      if (s.items[0].platform) {
        data.study = s.items.slice(0, 30);
      } else {
        data.study = convertStudy(s);
      }
      changed = true;
    }
    if (changed) { saveData(); if (renderers[state.tab]) renderers[state.tab](); }
  } catch (_) { /* 拉取失败则保留内置快照 */ }
}

/* ---------- 数据层（第一阶段：localStorage，第二阶段换 IndexedDB） ---------- */

function defaultCategories() {
  return [
    { id: 'c_in_1',  type: 'income',  name: '工资收入', icon: '💼', isDefault: true, order: 0 },
    { id: 'c_in_2',  type: 'income',  name: '奖金',     icon: '🎁', isDefault: true, order: 1 },
    { id: 'c_in_3',  type: 'income',  name: '理财收入', icon: '📈', isDefault: true, order: 2 },
    { id: 'c_in_4',  type: 'income',  name: '其他收入', icon: '✨', isDefault: true, order: 3 },
    { id: 'c_ex_1',  type: 'expense', name: '餐费',     icon: '🍜', isDefault: true, order: 0 },
    { id: 'c_ex_2',  type: 'expense', name: '交通费',   icon: '🚌', isDefault: true, order: 1 },
    { id: 'c_ex_3',  type: 'expense', name: '美容费',   icon: '💄', isDefault: true, order: 2 },
    { id: 'c_ex_4',  type: 'expense', name: '租金物业费', icon: '🏠', isDefault: true, order: 3 },
    { id: 'c_ex_5',  type: 'expense', name: '生活用品费', icon: '🛒', isDefault: true, order: 4 },
    { id: 'c_ex_6',  type: 'expense', name: '服装费',   icon: '👗', isDefault: true, order: 5 },
    { id: 'c_ex_7',  type: 'expense', name: '学习费',   icon: '📚', isDefault: true, order: 6 },
    { id: 'c_ex_8',  type: 'expense', name: '通讯费',   icon: '📱', isDefault: true, order: 7 },
    { id: 'c_ex_9',  type: 'expense', name: '会员费',   icon: '🎫', isDefault: true, order: 8 },
    { id: 'c_ex_10', type: 'expense', name: '其他费用', icon: '📦', isDefault: true, order: 9 },
    { id: 'c_ex_11', type: 'expense', name: '宠物',     icon: '🐾', isDefault: false, order: 10 },
  ];
}

function buildMock() {
  const T = todayKey();
  const d = n => dateKey(daysAgo(n));
  const t = (text, date, cat, done, o = {}) => ({
    id: uid('td'), text, date, cat, done,
    createdAt: (date + 'T09:00:00'), doneAt: done ? (date + 'T10:00:00') : null,
    dueTime: o.dueTime || null, order: o.order ?? 0,
  });
  const tx = (type, catId, amount, date, note) => ({ id: uid('tx'), type, catId, amount, date, note: note || '' });
  const s = (itemId, date, startedAt, durationMin) => ({
    id: uid('fs'), itemId, date, mode: 'countup',
    startedAt: date + 'T' + startedAt, endedAt: date + 'T' + startedAt, durationMs: durationMin * 60000,
  });

  const categories = defaultCategories();
  const catId = (type, name) => categories.find(c => c.type === type && c.name === name).id;

  return {
    _demo: true,
    user: { id: 'u_local', name: '知日用户', createdAt: '2026-07-01' },
    settings: { theme: 'light', bannerDismissed: false },
    todos: [
      // 今天（5 完成 / 3 未完成）
      t('核对本月结算单', T, 'work', true,  { dueTime: '10:00', order: 0 }),
      t('回复客户邮件',   T, 'work', true,  { order: 1 }),
      t('更新店铺商品信息', T, 'work', false, { dueTime: '18:00', order: 2 }),
      t('整理报销发票',   T, 'work', false, { order: 3 }),
      t('去超市买菜',     T, 'life', true,  { order: 4 }),
      t('预约下周体检',   T, 'life', true,  { order: 5 }),
      t('阅读 30 分钟',   T, 'life', false, { order: 6 }),
      t('给妈妈打电话',   T, 'life', true,  { order: 7 }),
      // 昨天（历史记录）
      t('提交周报',       d(1), 'work', true, { order: 0 }),
      t('剪头发',         d(1), 'life', true, { order: 1 }),
      // 前天
      t('学完 PS 课程第 3 节', d(2), 'life', true,  { order: 0 }),
      t('处理退货订单',   d(2), 'work', false, { order: 1 }),
      // 未来
      t('周末和朋友爬山', d(-1), 'life', false, { order: 0 }),
      t('整理三季度预算', d(-2), 'work', false, { order: 1 }),
    ],
    categories,
    transactions: [
      tx('income',  catId('income', '工资收入'), 12000, d(20), '7 月工资'),
      tx('income',  catId('income', '奖金'),      2000, d(18), '季度绩效'),
      tx('income',  catId('income', '理财收入'),   356.8, d(6), '货币基金收益'),
      tx('expense', catId('expense', '租金物业费'), 2800, d(8), '房租 + 物业'),

function renderTodo() {
  const el = document.getElementById('tab-todo');
  const date = state.todoDate;
  const allTodos = (data.todos || []).filter(t => t.date === date).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  const todos = state.todoFilter === 'all' ? allTodos : allTodos.filter(t => t.cat === state.todoFilter);
  const done = todos.filter(t => t.done).length;
  const pct = todos.length ? Math.round(done / todos.length * 100) : 0;

  // 日期条（前后各 3 天）
  const base = parseKey(date);
  let strip = '<div class="date-strip">';
  for (let i = -3; i <= 3; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i);
    const k = dateKey(d);
    const has = (data.todos || []).some(t => t.date === k);
    strip += `<button class="ds-item ${k === date ? 'on' : ''} ${k === todayKey() ? 'is-today' : ''}" onclick="setTodoDate('${k}')">
      <span class="ds-w">${fmtW(d)}</span><span class="ds-d">${d.getMonth() + 1}/${d.getDate()}</span>
      ${has ? '<span style="font-size:8px;color:var(--apricot)">●</span>' : '<span style="font-size:8px">·</span>'}
    </button>`;
  }
  strip += '</div>';

  const label = isToday(date) ? '今日' : fmtYMD(date) + ' ' + fmtWeekday(date);
  const prog = `<div class="todo-progress">
    <span class="tp-text"><b>${label}</b> 完成 <b>${done}</b>/${todos.length} · ${pct}%</span>
    <span class="tp-bar"><span class="tp-fill" style="width:${pct}%"></span></span>
  </div>`;

  const listHtml = todos.length ? `<div class="todo-list" id="todoList">${todos.map(todoItemHtml).join('')}</div>
    <div class="swipe-hint">← 左滑待办可修改或删除</div>`
    : `<div class="empty">这一天还没有待办<br>点右下角 + 添加</div>`;

  el.innerHTML = `<div class="tab-hero">
      <div class="th-sub">今日待办</div>
      <div class="th-main">早上好，今天也稳稳来</div>
    </div>
    <div class="chips" style="padding-bottom:8px">
      <button class="chip ${state.todoFilter === 'all' ? 'on' : ''}" onclick="setTodoFilter('all')">全部</button>
      <button class="chip ${state.todoFilter === 'work' ? 'on' : ''}" onclick="setTodoFilter('work')">工作</button>
      <button class="chip ${state.todoFilter === 'life' ? 'on' : ''}" onclick="setTodoFilter('life')">生活</button>
    </div>
    ${strip}${prog}${listHtml}
    <button class="fab" onclick="openTodoAdd()" title="添加待办">${SVG_PLUS}</button>`;
  bindTodoDrag();
  bindTodoSwipe();
}
function setTodoFilter(f) { state.todoFilter = f; renderTodo(); }

function todoItemHtml(t) {
  const catPill = t.cat === 'work' ? '<span class="tag-pill tag-work">工作</span>'
    : t.cat === 'life' ? '<span class="tag-pill tag-life">生活</span>' : '';
  let dueHtml = '';
  if (t.dueTime) {
    const now = new Date();
    const cur = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    const overdue = !t.done && isToday(t.date) && t.dueTime < cur;
    dueHtml = `<span class="due-txt ${overdue ? 'soon' : ''}">截止 ${esc(t.dueTime)}</span>`;
  }
  return `<div class="todo-item-wrap">
    <div class="todo-swipe">
      <button class="tsw-btn tsw-edit" onclick="openTodoEdit('${t.id}')">${SVG_EDIT}<span>修改</span></button>
      <button class="tsw-btn tsw-del" onclick="tdDel('${t.id}')">${SVG_TRASH}<span>删除</span></button>
    </div>
    <div class="todo-item ${t.done ? 'done' : ''}" data-id="${t.id}">
      <button class="check ${t.done ? 'on' : ''}" onclick="tdToggle('${t.id}')" title="标记完成 / 取消"><span class="ck-circle">✓</span></button>
      <div class="td-main" onclick="openTodoEdit('${t.id}')">
        <div class="td-text">${esc(t.text)}</div>
        <div class="td-meta">${catPill}${dueHtml}</div>
      </div>
      <div class="grip" title="拖动排序">⋮⋮</div>
    </div>
  </div>`;
}

/* ---------- 待办拖拽排序（Pointer 事件，鼠标/触屏通用） ---------- */
function bindTodoDrag() {
  const list = document.getElementById('todoList');
  if (!list) return;
  const items = () => Array.from(list.querySelectorAll('.todo-item'));
  const grip = e => e.target.closest('.grip');
  list.querySelectorAll('.todo-item').forEach(item => {
    item.addEventListener('pointerdown', e => {
      if (!grip(e)) return;
      e.preventDefault();
      const idx = items().indexOf(item);
      state.drag = { id: item.dataset.id, fromIdx: idx, y: e.clientY, h: item.offsetHeight, moved: false };
      item.classList.add('dragging');
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });
    item.addEventListener('pointermove', e => {
      if (!state.drag || state.drag.id !== item.dataset.id) return;
      const dy = e.clientY - state.drag.y;
      if (Math.abs(dy) > 5) state.drag.moved = true;
      item.style.transform = `translateY(${dy}px)`;
      item.style.zIndex = 5;
    });
    item.addEventListener('pointerup', e => {
      if (!state.drag || state.drag.id !== item.dataset.id) return;
      const fromIdx = state.drag.fromIdx;
      let toIdx = fromIdx;
      items().forEach((other, i) => {
        if (other === item) return;
        const r = other.getBoundingClientRect();
        if (e.clientY > r.top + r.height / 2) toIdx = i;
      });
      state.drag = null;
      item.classList.remove('dragging');
      item.style.transform = ''; item.style.zIndex = '';
      if (toIdx !== fromIdx) {
        const list2 = data.todos.filter(t => t.date === state.todoDate).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const [moved] = list2.splice(fromIdx, 1);
        list2.splice(toIdx, 0, moved);
        list2.forEach((t, i) => t.order = i);
        saveData();
      }
      renderTodo();
    });
    item.addEventListener('pointercancel', () => {
      if (state.drag && state.drag.id === item.dataset.id) {
        state.drag = null; item.classList.remove('dragging');
        item.style.transform = ''; item.style.zIndex = '';
        renderTodo();
      }
    });
  });
}

/* ---------- 待办左滑操作（修改 / 删除） ---------- */
let swipe = null;
function closeSwipe() {
  if (!state.swipeOpenId) return;
  const el = document.querySelector(`.todo-item[data-id="${state.swipeOpenId}"]`);
  if (el) { el.classList.remove('swiping'); el.style.transform = ''; }
  state.swipeOpenId = null;
}
function bindTodoSwipe() {
  const list = document.getElementById('todoList');
  if (!list) return;
  list.querySelectorAll('.todo-item').forEach(item => {
    item.addEventListener('pointerdown', e => {
      if (e.target.closest('.grip')) return; // 拖拽排序由 grip 处理
      if (e.target.closest('.check')) return; // 点击圆圈不动滑动
      const id = item.dataset.id;
      if (state.swipeOpenId && state.swipeOpenId !== id) closeSwipe();
      swipe = { id, x: e.clientX, open: state.swipeOpenId === id, moved: false };
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });
    item.addEventListener('pointermove', e => {
      if (!swipe || swipe.id !== item.dataset.id) return;
      const dx = e.clientX - swipe.x;
      if (Math.abs(dx) > 6) { swipe.moved = true; item.classList.add('swiping'); }
      const base = swipe.open ? -124 : 0;
      const t = Math.max(-124, Math.min(0, base + dx));
      item.style.transform = `translateX(${t}px)`;
    });
    item.addEventListener('pointerup', e => {
      if (!swipe || swipe.id !== item.dataset.id) return;
      const dx = e.clientX - swipe.x;
      const open = swipe.open ? dx < 40 : dx < -40;
      if (open) {
        item.style.transform = 'translateX(-124px)';
        state.swipeOpenId = item.dataset.id;
      } else {
        item.style.transform = '';
        state.swipeOpenId = null;
      }
      item.classList.remove('swiping');
      swipe = null;
    });
    item.addEventListener('pointercancel', () => {
      if (swipe && swipe.id === item.dataset.id) { swipe = null; item.classList.remove('swiping'); item.style.transform = ''; }
    });
  });
}

/* ---------- 数据管理：备份 / 恢复 / 重置 ---------- */
function openDataManage() {
  const d = data;
  const todoN = d.todos ? d.todos.length : 0;
  const txN = d.transactions ? d.transactions.length : 0;
  const fsN = d.focusSessions ? d.focusSessions.length : 0;
  const last = localStorage.getItem('zhiri_last_backup') || '';
  let backupHint = '从未备份，建议现在导出一份';
  if (last) {
    const days = Math.floor((Date.now() - new Date(last + 'T00:00:00').getTime()) / 86400000);
    backupHint = days <= 7 ? '上次备份：' + last + ' ✅' : '上次备份：' + last + '（已超过 7 天，建议重新备份）';
  }
  openSheet(`<div class="sheet-title">数据管理</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;line-height:1.7">
      当前本机数据：待办 ${todoN} 条 · 账目 ${txN} 笔 · 专注记录 ${fsN} 条<br>
      ${backupHint}
    </div>
    <div class="form-row">
      <button class="btn block" onclick="exportBackup()">⬇ 导出备份（下载数据文件）</button>
    </div>
    <div class="form-row">
      <label class="form-label">从备份文件恢复</label>
      <input class="in" type="file" id="backupFile" accept=".json,application/json" style="padding:10px">
    </div>
    <div class="form-row">
      <button class="btn warn block" onclick="askResetData()">清空全部数据</button>
    </div>
    <div style="font-size:11.5px;color:var(--text-faint);text-align:center">备份文件包含你的全部记录，请自行妥善保管</div>`);
  const fi = document.getElementById('backupFile');
  if (fi) fi.addEventListener('change', importBackup);
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '知日备份_' + todayKey() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  try { localStorage.setItem('zhiri_last_backup', todayKey()); } catch (_) {}
  showToast('备份已导出，请妥善保存该文件');
}
function importBackup(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.todos) || !Array.isArray(d.transactions)) {
        showToast('备份文件格式不正确'); return;
      }
      data = d;
      saveData();
      closeSheet();
      showToast('恢复成功');
      setTimeout(() => location.reload(), 600);
    } catch (_) { showToast('备份文件无法读取'); }
  };
  reader.readAsText(file);
}
function askResetData() {
  openSheet(`<div class="sheet-title">清空全部数据？</div>
    <div style="font-size:13.5px;color:var(--text-dim);margin-bottom:6px">将删除本机全部待办、账目和专注记录，<b>无法恢复</b>。建议先导出备份。</div>
    <div class="form-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn warn" onclick="confirmResetData()">确认清空</button>
    </div>`);
}
function confirmResetData() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  closeSheet();
  location.reload();
}

function rangeFiltered() {
  const all = data.transactions || [];
  if (state.acctRange === 'custom' && state.acctStart && state.acctEnd)
    return all.filter(t => t.date >= state.acctStart && t.date <= state.acctEnd);
  if (state.acctRange === 'year')
    return all.filter(t => t.date.slice(0, 4) === todayKey().slice(0, 4));
  return all.filter(t => t.date.slice(0, 7) === todayKey().slice(0, 7));
}
function filteredTx() {
  const range = rangeFiltered();
  if (state.acctFilter === 'all') return range;
  return range.filter(t => t.type === state.acctFilter);
}
function rangeLabel() {
  if (state.acctRange === 'year') return todayKey().slice(0, 4) + ' 年';
  if (state.acctRange === 'custom') return (state.acctStart || '?') + ' ~ ' + (state.acctEnd || '?');
  return fmtYMD(todayKey()).slice(0, -2) + '月';
}
function catById(id) { return data.categories.find(c => c.id === id); }

      </div>` : '';

    const dayInc = groups[dk].filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);

        const c = catById(t.catId) || { icon: '❓', name: '未分类' };

  }).join('') : `<div class="empty">该范围内暂无记录<br>点右下角 + 记账</div>`;

  const incPct = inc + exp > 0 ? (inc / (inc + exp) * 100).toFixed(0) : '0';

      <div class="th-sub">财务小账本</div>
      <div class="th-main">每一笔，都心里有数</div>

    <div class="acct-balance">
      <div class="ab-label">结余（收入 − 支出）</div>
      <div class="ab-val" style="${bal < 0 ? 'color:#F0B7AE' : ''}">${fmtMoney(bal)}</div>
    </div>
    <div class="acct-two">
      <div class="at-card income"><div class="at-label">收入</div><div class="at-val">${fmtMoney(inc)}</div></div>
      <div class="at-card expense"><div class="at-label">支出</div><div class="at-val">${fmtMoney(exp)}</div></div>
    </div>
    <div class="acct-ops">
      <div class="seg">
        <button class="${state.acctRange === 'month' ? 'on' : ''}" onclick="setAcctRange('month')">本月</button>
        <button class="${state.acctRange === 'year' ? 'on' : ''}" onclick="setAcctRange('year')">本年</button>
        <button class="${state.acctRange === 'custom' ? 'on' : ''}" onclick="setAcctRange('custom')">自定义</button>
      </div>
      ${customRow}
    </div>
    <div class="card" style="padding:14px 15px;margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-family:var(--font-serif);font-weight:600;font-size:15px;color:var(--green-deep)">支出趋势</span>
        <span style="font-size:11px;color:var(--text-faint)">${label} · 仅统计支出</span>
      </div>
      <div class="seg" style="margin-bottom:10px">
        <button class="${state.acctGran === 'day' ? 'on' : ''}" onclick="setAcctGran('day')">日</button>
        <button class="${state.acctGran === 'month' ? 'on' : ''}" onclick="setAcctGran('month')">月</button>
        <button class="${state.acctGran === 'quarter' ? 'on' : ''}" onclick="setAcctGran('quarter')">季</button>

      </div>
    </div>
    <div class="card" style="padding:14px 15px;margin-bottom:14px">
      <div style="font-family:var(--font-serif);font-weight:600;font-size:15px;color:var(--green-deep);margin-bottom:4px">分类占比</div>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:8px">${state.acctFilter === 'income' ? '收入分类' : state.acctFilter === 'expense' ? '支出分类' : '支出 / 收入分类'} · ${label}</div>
      ${acctCatBlocks()}
    </div>
    ${listHtml}
    <button class="fab" onclick="openTxAdd()" title="记一笔">${SVG_PLUS}</button>`;

function setAcctRange(r) {
  state.acctRange = r;
  if (r === 'custom' && !state.acctStart) {
    state.acctStart = dateKey(daysAgo(30)); state.acctEnd = todayKey();
  }
  renderAcct();
}
function setAcctCustom() {
  state.acctStart = document.getElementById('acStart').value;
  state.acctEnd = document.getElementById('acEnd').value;
  if (state.acctStart && state.acctEnd && state.acctStart > state.acctEnd) {
    showToast('开始日期不能晚于结束日期'); return;
  }
  renderAcct();
}
function setAcctFilter(f) { state.acctFilter = f; renderAcct(); }
function setAcctGran(g) { state.acctGran = g; renderAcct(); }

function catBars(type) {
  const tx = rangeFiltered().filter(t => t.type === type);
  const rows = {};
  tx.forEach(t => rows[t.catId] = (rows[t.catId] || 0) + t.amount);
  const total = Object.values(rows).reduce((s, v) => s + v, 0);
  const arr = Object.entries(rows).map(([id, amt]) => ({ c: catById(id), amt })).filter(x => x.c).sort((a, b) => b.amt - a.amt);
  if (!arr.length) return `<div class="empty" style="padding:16px 0">暂无${type === 'income' ? '收入' : '支出'}记录</div>`;
  const max = Math.max(...arr.map(x => x.amt), 1);
  const tname = type === 'income' ? '收入' : '支出';
  return `<div style="font-size:12px;color:var(--text-dim);margin:2px 0 6px">${tname}</div>` + arr.slice(0, 8).map(({ c, amt }) => `
    <div class="cat-bar-row">
      <span class="cbr-ico">${esc(c.icon)}</span>
      <span class="cbr-name">${esc(c.name)}</span>
      <span class="cbr-track"><span class="cbr-fill ${type}" style="width:${(amt / max * 100).toFixed(1)}%"></span></span>
      <span class="cbr-pct">${total ? (amt / total * 100).toFixed(0) : 0}%</span>
      <span class="cbr-amt">${fmtMoney(amt)}</span>
    </div>`).join('');
}

function trendBuckets(gran) {
  const now = new Date(); const out = [];
  if (gran === 'day') {
    for (let i = 13; i >= 0; i--) { const d = daysAgo(i); out.push({ key: dateKey(d), label: `${d.getMonth() + 1}/${d.getDate()}`, full: dateKey(d) }); }
  } else if (gran === 'month') {
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({ key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}月`, full: null }); }
  } else if (gran === 'quarter') {
    for (let i = 3; i >= 0; i--) { const m = now.getMonth() - i * 3; const d = new Date(now.getFullYear(), m, 1); out.push({ key: `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`, label: `Q${Math.floor(d.getMonth() / 3) + 1}`, full: null }); }
  } else {
    for (let i = 4; i >= 0; i--) { const y = now.getFullYear() - i; out.push({ key: String(y), label: `${y}`, full: null }); }
  }
  return out;
}
function inBucket(t, b) {
  if (b.full) return t.date === b.full;
  if (b.key.includes('Q')) { const [y, q] = b.key.split('-Q'); return t.date.slice(0, 4) === y && Math.floor((+t.date.slice(5, 7) - 1) / 3) + 1 === +q; }
  if (/^\d{4}$/.test(b.key)) return t.date.slice(0, 4) === b.key;
  return t.date.slice(0, 7) === b.key;
}
function fmtAxis(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(n % 100000000 === 0 ? 0 : 1) + '亿';
  if (n >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(Math.round(n));
}
function trendChart() {
  const gran = state.acctGran;
  const buckets = trendBuckets(gran);
  const sums = buckets.map(b => {
    let exp = 0;
    (data.transactions || []).forEach(t => { if (t.type === 'expense' && inBucket(t, b)) exp += t.amount; });
    return exp;
  });
  const max = Math.max(...sums, 1) * 1.15;
  const W = 340, H = 150, padL = 34, padT = 8, padB = 16, plotH = H - padT - padB;
  const plotW = W - padL;
  const step = buckets.length > 1 ? plotW / (buckets.length - 1) : 0;
  const pts = sums.map((v, i) => {
    const x = padL + i * step;
    const y = v > 0 ? H - padB - (v / max * plotH) : H - padB;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const minW = padL + buckets.length * (gran === 'day' ? 24 : 46);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${minW}px" xmlns="http://www.w3.org/2000/svg">`;
  // 网格线 + Y 轴金额刻度
  for (let i = 0; i <= 3; i++) {
    const y = padT + plotH * i / 3;
    const val = max * (1 - i / 3);
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    svg += `<text x="${padL - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">¥${fmtAxis(val)}</text>`;
  }
  svg += `<polygon points="${padL},${H - padB} ${pts} ${W},${H - padB}" fill="var(--danger)" opacity=".08"/>`;
  svg += `<polyline points="${pts}" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  sums.forEach((v, i) => {
    const x = padL + i * step;
    const y = v > 0 ? H - padB - (v / max * plotH) : H - padB;
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--card)" stroke="var(--danger)" stroke-width="2"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${buckets[i].label}</text>`;
  });
  return svg + '</svg>';
}

function exportCSV() {
  const rows = [['日期', '类型', '分类', '金额', '备注']];
  filteredTx().sort((a, b) => a.date < b.date ? 1 : -1).forEach(t => {
    const c = catById(t.catId);
    rows.push([t.date, t.type === 'income' ? '收入' : '支出', c ? c.name : '未分类', String(t.amount), t.note || '']);
  });
  const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '知日记账_' + todayKey() + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  showToast('已导出 ' + (rows.length - 1) + ' 条记录');
}

/* ---------- 记账：新增 / 编辑 ---------- */
let _editTxId = null;
let _txType = 'expense';
let _txCat = null;

function openTxAdd() {
  _editTxId = null; _txType = 'expense';
  const cats = data.categories.filter(c => c.type === 'expense');
  _txCat = cats[0] ? cats[0].id : null;
  openSheet(txFormHtml('', todayKey(), '', false));
  refreshTxType();
  refreshTxCats();
}
function openTxEdit(id) {
  const t = data.transactions.find(x => x.id === id);
  if (!t) return;
  _editTxId = id; _txType = t.type; _txCat = t.catId;
  openSheet(txFormHtml(t.amount, t.date, t.note, true));
  refreshTxType();
  refreshTxCats();
}
function txFormHtml(amount, date, note, isEdit) {
  return `<div class="sheet-title">${isEdit ? '编辑记录' : '记一笔'}</div>
    <div class="form-row"><div class="mode-pick">
      <button class="btn ghost" id="txTypeExp" onclick="pickTxType('expense')">支 出</button>
      <button class="btn ghost" id="txTypeInc" onclick="pickTxType('income')">收 入</button>
    </div></div>
    <div class="form-row">
      <label class="form-label">金额</label>
      <input class="in" type="number" id="txAmount" value="${esc(String(amount))}" placeholder="0.00" inputmode="decimal" step="0.01" min="0">
    </div>
    <div class="form-row">
      <label class="form-label">分类</label>
      <div class="cat-grid" id="txCatGrid"></div>
    </div>
    <div class="form-row" style="display:flex;gap:8px">
      <input class="in" type="date" id="txDate" value="${esc(date)}" style="flex:1;min-width:0">
      <input class="in" id="txNote" value="${esc(note)}" placeholder="备注（可选）" maxlength="40" style="flex:1.6;min-width:0">
    </div>
    <div class="form-actions">
      ${isEdit ? '<button class="btn warn" onclick="delTx()">删除</button>' : ''}
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="saveTx()">${isEdit ? '保存' : '添加'}</button>
    </div>`;
}
function pickTxType(type) {
  _txType = type;
  const cats = data.categories.filter(c => c.type === type);
  _txCat = cats.some(c => c.id === _txCat) ? _txCat : (cats[0] ? cats[0].id : null);
  refreshTxType(); refreshTxCats();
}
function refreshTxType() {
  const e = document.getElementById('txTypeExp'), i = document.getElementById('txTypeInc');
  if (e) e.classList.toggle('on', _txType === 'expense');
  if (i) i.classList.toggle('on', _txType === 'income');
}
function refreshTxCats() {
  const grid = document.getElementById('txCatGrid');
  if (!grid) return;
  const cats = data.categories.filter(c => c.type === _txType);
  grid.innerHTML = cats.map(c => `<button class="cat-cell ${c.id === _txCat ? 'on' : ''}" onclick="pickTxCat('${c.id}')">
    <span class="cc-ico">${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`).join('');
}
function pickTxCat(id) { _txCat = id; refreshTxCats(); }
function saveTx() {
  const amount = parseFloat(document.getElementById('txAmount').value);
  const date = document.getElementById('txDate').value;
  const note = document.getElementById('txNote').value.trim();
  if (!amount || amount <= 0) { showToast('请输入有效金额'); return; }
  if (!_txCat) { showToast('请选择分类'); return; }
  if (!date) { showToast('请选择日期'); return; }
  if (_editTxId) {
    const t = data.transactions.find(x => x.id === _editTxId);
    if (t) Object.assign(t, { amount, date, note, catId: _txCat, type: _txType });
    showToast('已保存');
  } else {
    data.transactions.push({ id: uid('tx'), type: _txType, catId: _txCat, amount, date, note });
    showToast('已记账');
  }
  saveData(); closeSheet(); renderAcct();
}
function delTx() {
  data.transactions = data.transactions.filter(x => x.id !== _editTxId);
  saveData(); closeSheet(); renderAcct();
}

        <span style="flex:1;font-size:14px">${esc(c.name)}${c.isDefault ? '<span style="font-size:10.5px;color:var(--text-faint);margin-left:6px">默认</span>' : ''}</span>
        <button class="icon-btn" style="width:44px;height:44px;min-width:44px;border:none;background:transparent" onclick="openCatEdit('${c.id}')">${SVG_EDIT}</button>
        ${c.isDefault ? '' : `<button class="icon-btn" style="width:44px;height:44px;min-width:44px;border:none;background:transparent;color:var(--danger)" onclick="delCat('${c.id}')">${SVG_TRASH}</button>`}
      </div>`).join('')}`;
  };

/* ============================================================
 * 页签五：专注（计时基于时间戳，锁屏/关闭后恢复不依赖前端定时器）
 * ============================================================ */
const ITEM_COLORS = ['green', 'mist', 'lavender'];

function sessionsForItem(id) { return (data.focusSessions || []).filter(s => s.itemId === id); }
function itemTodayMs(id) { return sessionsForItem(id).filter(s => s.date === todayKey()).reduce((a, s) => a + s.durationMs, 0); }
function itemTotalMs(id) { return sessionsForItem(id).reduce((a, s) => a + s.durationMs, 0); }
function todayTotalMs() { return (data.focusSessions || []).filter(s => s.date === todayKey()).reduce((a, s) => a + s.durationMs, 0); }
function weekTotalMs() {
  const now = new Date();
  const diff = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const mon = new Date(now); mon.setDate(now.getDate() - diff);
  const wk = dateKey(mon);
  return (data.focusSessions || []).filter(s => s.date >= wk && s.date <= todayKey()).reduce((a, s) => a + s.durationMs, 0);
}

/* ---------- 计时核心（时间戳计算，与前端定时器无关） ---------- */
function focusActiveMs(r) {
  const start = new Date(r.startedAt).getTime();
  const paused = r.totalPausedMs || 0;
  if (r.pausedAt) return new Date(r.pausedAt).getTime() - start - paused;
  return Date.now() - start - paused;
}
function focusRemainingMs(r) {
  if (r.mode !== 'countdown') return null;
  return Math.max(0, (r.countdownMin * 60000) - focusActiveMs(r));
}

function saveRunning() {
  try {
    if (state.focusRunning) localStorage.setItem(RUNNING_KEY, JSON.stringify(state.focusRunning));
    else localStorage.removeItem(RUNNING_KEY);
  } catch (_) {}
}
function restoreRunning() {
  try {
    const raw = localStorage.getItem(RUNNING_KEY);
    if (!raw) return;
    const r = JSON.parse(raw);
    const item = data.focusItems.find(x => x.id === r.itemId);
    if (!item) { localStorage.removeItem(RUNNING_KEY); return; }
    const age = Date.now() - new Date(r.startedAt).getTime();
    if (age > 24 * 3600000) { localStorage.removeItem(RUNNING_KEY); return; } // 过期状态丢弃
    state.focusRunning = r;
    // 倒计时若在关闭期间已结束：补记一次并通知
    if (r.mode === 'countdown' && !r.pausedAt && focusRemainingMs(r) <= 0) {
      finalizeFocus(false);
    }
  } catch (_) { localStorage.removeItem(RUNNING_KEY); }
}

function pickFocusItem(id) {

    </div></div>

function pickFocusMode(m) {

function pickFocusMin(m) { state._focusMin = m; const i = document.getElementById('fmCustom'); if (i) i.value = m; }
function pickFocusMinFromInput() {

}
function startFocusNow() {
  const item = data.focusItems.find(x => x.id === state._focusItemId);

    const v = parseInt(document.getElementById('fmCustom').value, 10);
    if (!v || v <= 0) { showToast('请输入倒计时时长'); return; }
    state._focusMin = v;
  }
  ensureNotifPermission();
  state.focusRunning = {
    itemId: item.id, mode: state._focusMode, startedAt: new Date().toISOString(),
    pausedAt: null, totalPausedMs: 0,
    countdownMin: state._focusMode === 'countdown' ? state._focusMin : 0,
  };
  saveRunning(); closeSheet(); renderFocus();
  showToast(state._focusMode === 'countdown' ? `倒计时 ${state._focusMin} 分钟开始` : '开始计时');
}

function pauseFocus() {
  if (!state.focusRunning || state.focusRunning.pausedAt) return;
  state.focusRunning.pausedAt = new Date().toISOString();
  saveRunning(); renderFocus();
}
function resumeFocus() {
  const r = state.focusRunning;
  if (!r || !r.pausedAt) return;
  r.totalPausedMs = (r.totalPausedMs || 0) + (Date.now() - new Date(r.pausedAt).getTime());
  r.pausedAt = null;
  saveRunning(); renderFocus();
}
function endFocus() {
  if (!state.focusRunning) return;
  finalizeFocus(true);
}
function finalizeFocus(manual) {
  const r = state.focusRunning;
  state.focusRunning = null;
  saveRunning();
  if (!r) return;
  let ms = focusActiveMs(r);
  if (ms < 1000) { showToast('计时太短，未记录'); renderFocus(); return; }
  const item = data.focusItems.find(x => x.id === r.itemId);
  const durMin = Math.round(ms / 60000 * 10) / 10;
  data.focusSessions.push({
    id: uid('fs'), itemId: r.itemId, date: todayKey(), mode: r.mode,
    startedAt: r.startedAt, endedAt: new Date().toISOString(), durationMs: ms,
  });
  saveData(); renderFocus();
  if (r.mode === 'countdown' && !manual) {
    notifyFocusDone(item ? item.name : '', Math.max(1, Math.round(r.countdownMin)));
  } else {
    showToast(`已记录 ${fmtHours(ms)}${item ? ' · ' + item.name : ''}`);
  }
}

/* ---------- 通知 ---------- */
function ensureNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (_) {}
  }
}
function notifyFocusDone(name, min) {
  const body = `「${name}」专注 ${min} 分钟完成，休息一下吧 ☕`;
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('知日 · 专注结束', { body, tag: 'zhiri-focus', renotify: true }); } catch (_) {}
  }
  showToast(body);
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (_) {} }
  beep();
}
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
    o.start(); o.stop(ctx.currentTime + 0.75);
  } catch (_) {}
}

/* ---------- 渲染 ---------- */
function renderFocus() {
  const el = document.getElementById('tab-focus');
  const todayMs = todayTotalMs();
  const weekMs = weekTotalMs();
  const r = state.focusRunning;

  const itemsHtml = data.focusItems.length ? data.focusItems.map(item => {
    const isRunning = r && r.itemId === item.id;
    const todayMs_i = itemTodayMs(item.id);
    const totalMs = itemTotalMs(item.id);
    const goalMs = item.goalMin * 60000;
    const pct = Math.min(100, Math.round(todayMs_i / goalMs * 100));
    const reached = todayMs_i >= goalMs;

    let timerHtml = '', ctlHtml = '';
    if (isRunning) {
      const remain = focusRemainingMs(r);
      const disp = r.mode === 'countdown' ? fmtClock(remain) : fmtClock(focusActiveMs(r));
      const label = r.mode === 'countdown' ? `剩余 ${disp}` : `已专注 ${disp}`;
      timerHtml = `<div class="fc-timer"><span class="pulse"></span><span class="fc-timer-text">${label}</span></div>`;

        ctlHtml = `<div class="fc-ctl">

      }
    } else {
      timerHtml = `<div class="fc-timer" style="color:var(--text-dim);font-size:15px;font-weight:500;margin-top:6px">${reached ? '✓ 今日目标已达成' : '今日 ' + fmtHours(todayMs_i) + ' / 目标 ' + fmtHours(goalMs)}</div>`;
      ctlHtml = `<div class="fc-ctl"><button class="btn" onclick="pickFocusItem('${item.id}')">▶ 开始</button></div>`;
    }

    const dotColor = item.color === 'mist' ? 'var(--mist)' : item.color === 'lavender' ? 'var(--lavender)' : 'var(--green)';
    return `<div class="focus-card ${isRunning ? 'running' : ''}">
      <div class="fc-head">
        <span style="width:10px;height:10px;border-radius:50%;background:${dotColor};display:inline-block"></span>

      </div>

      <div class="fc-stats">
        <span>今日 <b>${fmtHours(todayMs_i)}</b></span>
        <span>累计 <b>${fmtHours(totalMs)}</b></span>
      </div>
      ${ctlHtml}
    </div>`;
  }).join('') : `<div class="empty">还没有专注事项<br>点右下角 + 新建</div>`;

  el.innerHTML = `
    <div class="tab-hero">

function saveFocusItem() {
  const name = document.getElementById('fiName').value.trim();
  const goal = parseInt(document.getElementById('fiGoal').value, 10);
  if (!name) { showToast('请输入名称'); return; }
  if (!goal || goal <= 0) { showToast('目标时长需大于 0'); return; }
  if (state._editFocusId) {
    const item = data.focusItems.find(x => x.id === state._editFocusId);
    if (item) { item.name = name; item.goalMin = goal; }
  } else {
    data.focusItems.push({
      id: uid('fi'), name, goalMin: goal,
      color: ITEM_COLORS[data.focusItems.length % ITEM_COLORS.length],
      createdAt: new Date().toISOString(),
    });
  }
  saveData(); closeSheet(); renderFocus();
}
function askDelFocus() {
  const item = data.focusItems.find(x => x.id === state._editFocusId);
  if (!item) return;
  const n = sessionsForItem(item.id).length;
  openSheet(`<div class="sheet-title">删除「${esc(item.name)}」？</div>
    <div style="font-size:13.5px;color:var(--text-dim);margin-bottom:6px">该事项的 ${n} 条专注记录也会一并删除，且无法恢复。</div>
    <div class="form-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn warn" onclick="confirmDelFocus()">确认删除</button>
    </div>`);
}
function confirmDelFocus() {
  const id = state._editFocusId;
  if (state.focusRunning && state.focusRunning.itemId === id) { showToast('请先结束进行中的专注'); return; }
  data.focusItems = data.focusItems.filter(x => x.id !== id);
  data.focusSessions = data.focusSessions.filter(s => s.itemId !== id);
  saveData(); closeSheet(); renderFocus();
}

/* ---------- 全局计时心跳（仅负责刷新显示；时长始终由时间戳计算） ---------- */
let focusTick = null;
function startFocusTick() {
  if (focusTick) return;
  focusTick = setInterval(() => {
    const r = state.focusRunning;
    if (!r) return;
    // 倒计时归零 → 结束并通知
    if (r.mode === 'countdown' && !r.pausedAt && focusRemainingMs(r) <= 0) {
      finalizeFocus(false);
      return;
    }
    const el = document.getElementById('tab-focus');
    if (el) {
      // 只更新文本 span，保留脉冲点（修复旧版 textContent 覆盖导致的心跳停止）
      const timerText = el.querySelector('.fc-timer-text');
      if (timerText) {
        const remain = focusRemainingMs(r);
        const disp = r.mode === 'countdown' ? fmtClock(remain) : fmtClock(focusActiveMs(r));
        const label = r.mode === 'countdown' ? `剩余 ${disp}` : `已专注 ${disp}`;
        if (timerText.textContent !== label) timerText.textContent = label;
      }
    }
  }, 1000);
}
/* ============================================================
 * 初始化与全局事件
 * ============================================================ */
function init() {
  // 头部日期
  const now = new Date();
  document.getElementById('hdDate').textContent =
    `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${fmtW(now)}`;

  // 主题
  const savedTheme = (data.settings && data.settings.theme) || 'light';
  applyTheme(savedTheme);
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  // 数据管理（备份 / 恢复 / 重置）
  document.getElementById('dataBtn').addEventListener('click', openDataManage);

  // 演示横幅
  if (data.settings && data.settings.bannerDismissed) {
    const b = document.getElementById('demoBanner');
    if (b) b.style.display = 'none';
  }
  document.getElementById('demoBannerX').addEventListener('click', () => {
    data.settings = data.settings || {};
    data.settings.bannerDismissed = true;
    saveData();
    document.getElementById('demoBanner').style.display = 'none';
  });

  // 底部导航
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // 弹层：点遮罩关闭
  document.getElementById('sheetMask').addEventListener('click', closeSheet);

  // 专注：恢复进行中的会话（时间戳恢复）+ 心跳
  restoreRunning();
  startFocusTick();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) renderFocus();
  });

  // 每日内容：拉取云端最新新闻/学习（失败自动保留内置快照）
  loadExternalFeed();

  // 暴露最小测试接口（仅开发调试用；应用自身不记录任何金额日志）
  window.__zhiri = { state, data, saveData, renderAll: () => renderers[state.tab]() };

  switchTab('todo');
}

/* ---------- 记账：分类占比（按当前筛选显示对应区块） ---------- */
function acctCatBlocks() {
  const f = state.acctFilter;
  let html = '';
  if (f === 'all' || f === 'expense') html += catBars('expense');
  if (f === 'all' || f === 'income') html += catBars('income');
  return html;
}

/* ---------- 启动 ---------- */
init();


</script>
