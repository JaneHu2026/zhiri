<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F7F2">
<meta name="description" content="知日 · 个人工作台（待办 / 记账 / 新闻 / 学习 / 专注）">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="胡">
<title>胡 · 个人工作台</title>
<style>
/* ============ 设计系统 ============ */
:root{
  --bg:#F8F7F2;            /* 页面背景（暖米白） */
  --surface:#FFFFFF;       /* 卡片表面 */
  --card:#FFFFFF;
  --text:#272C28;          /* 主文字 */
  --text-dim:#7B827C;      /* 次级文字 */
  --text-faint:#A9B0A9;    /* 弱化文字 */
  --green:#557263;         /* 主绿色 */
  --green-deep:#344F42;    /* 深绿色 */
  --green-soft:#E7EDE8;    /* 绿色浅底 */
  --on-green:#FFFFFF;      /* 绿底上的文字 */
  --line:#E6E5DE;          /* 分隔线 */
  --line-soft:#EFEEE8;
  --apricot:#D9B581;       /* 杏色点缀 */
  --apricot-soft:#F5EBD9;
  --lavender:#8E88B5;      /* 低饱和紫 */
  --lavender-soft:#ECEAF4;
  --mist:#7FA3B5;          /* 雾蓝 */
  --mist-soft:#E4EDF2;
  --danger:#B8554A;        /* 支出/删除（砖红，低饱和） */
  --danger-soft:#F6E7E4;
  --bean:#C07A72; --bean-deep:#A85E56; --bean-soft:#F3E4E1; --bean-line:#E8D2CD;  /* 健康页豆沙红系 */
  --income:#4E7A63;        /* 收入绿 */
  --income-soft:#E6EDE9;
  --shadow:0 2px 12px rgba(52,79,66,.07);
  --shadow-lg:0 8px 30px rgba(52,79,66,.14);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:9px;
  --font-serif:'Noto Serif SC','Songti SC','STSong','SimSun',Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --nav-h:60px;
}
[data-theme="dark"]{
  --bg:#1E221F; --surface:#262B27; --card:#2A302B;
  --text:#E6E4DC; --text-dim:#9AA39B; --text-faint:#6F776F;
  --green:#7FA08D; --green-deep:#C2D5C9; --green-soft:#303B34;
  --on-green:#1E221F;
  --line:#3A413B; --line-soft:#333A34;
  --apricot:#CDAC7C; --apricot-soft:#3B352A;
  --lavender:#A69FD3; --lavender-soft:#302E3C;
  --mist:#8FB4C7; --mist-soft:#2B373E;
  --danger:#D07A6E; --danger-soft:#3B2B28;
  --income:#8FB89F; --income-soft:#29372F;
  --shadow:0 2px 12px rgba(0,0,0,.28);
  --shadow-lg:0 8px 30px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* App 内滚动架构：body 固定，内容区独立滚动，标题栏/菜单栏永远固定 */
  position:fixed;inset:0;overflow:hidden;
  display:flex;justify-content:center;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
::-webkit-scrollbar{width:0;height:0}
#app{
  max-width:520px;width:100%;
  /* 用 svh（小视口）锁定高度：无论 iOS 地址栏如何伸缩，菜单栏都纹丝不动 */
  height:100svh;
  margin:0 auto;position:relative;
  display:flex;flex-direction:column;
  background:var(--bg);
}
@supports not (height:100svh){#app{height:100vh}}
@media(min-width:560px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:var(--shadow-lg)}
}
/* ============ 顶栏 ============ */
.app-header{
  flex:none;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.hd-left{min-width:0}
.hd-date{font-size:12.5px;color:var(--text-dim);line-height:1.5}
.hd-date b{font-size:15px;color:var(--text);font-weight:600;font-family:var(--font-serif);margin-right:2px}
.hd-right{display:flex;gap:8px;align-items:center}
.avatar{
  width:44px;height:44px;min-width:44px;border-radius:50%;
  background:var(--green-deep);color:var(--on-green);
  font-family:var(--font-serif);font-size:19px;font-weight:600;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.icon-btn{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  transition:transform .12s;
}
.icon-btn:active{transform:scale(.93)}
/* ============ 演示数据横幅 ============ */
.demo-banner{
  display:flex;align-items:center;gap:8px;
  margin:12px 16px 0;padding:8px 12px;border-radius:12px;
  background:var(--apricot-soft);border:1px solid color-mix(in srgb,var(--apricot) 45%,transparent);
  font-size:12.5px;color:var(--text-dim);
}
.demo-banner b{color:var(--apricot);font-weight:700}
.demo-banner .db-x{margin-left:auto;width:44px;height:44px;min-width:44px;border-radius:12px;font-size:14px;color:var(--text-dim)}
/* ============ 页签摘要区（小字 + 大字标题） ============ */
.tab-hero{margin:2px 2px 14px}
.th-sub{font-size:12.5px;color:var(--text-dim);letter-spacing:.06em}
.th-main{font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--green-deep);margin-top:3px;line-height:1.3}
/* ============ 主区与页签 ============ */
main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px 90px;
}
.tab{display:none}
.tab.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 12px}
.sec-title{font-family:var(--font-serif);font-size:20px;font-weight:600;color:var(--green-deep)}
.sec-sub{font-size:12px;color:var(--text-dim)}
/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.chip{
  flex:none;min-height:44px;padding:0 18px;border-radius:22px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
  transition:all .15s;
}
.chip.on{background:var(--green-deep);border-color:var(--green-deep);color:var(--on-green);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.seg{display:flex;background:var(--line-soft);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{
  flex:1;min-height:44px;border-radius:11px;font-size:14px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.seg button.on{background:var(--card);color:var(--green-deep);font-weight:600;box-shadow:var(--shadow)}
.btn{
  min-height:44px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--green-deep);color:var(--on-green);transition:transform .12s;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text-dim)}
.btn.warn{background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.btn.block{width:100%}
input.in,select.in,textarea.in{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;outline:none;transition:border-color .15s;
}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--green)}
input.in::placeholder,textarea.in::placeholder{color:var(--text-faint)}
.fab{
  position:fixed;z-index:25;right:max(18px,calc(50% - 244px));
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;color:var(--on-green);
  background:var(--green-deep);box-shadow:0 6px 20px rgba(52,79,66,.35);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.92)}
.empty{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;line-height:2}
.empty .e-ico{font-size:34px;display:block;margin-bottom:6px}
/* ============ 底部导航（flex 布局固定底部，不随页面滚动） ============ */
.bottom-nav{
  flex:none;z-index:40;
  width:100%;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:var(--surface);border-top:1px solid var(--line);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--text-dim);min-height:44px;
}
.nav-item .ni-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.nav-item .ni-ico svg{width:22px;height:22px;display:block}
[data-theme="dark"] .ic-moon{display:none}
[data-theme="light"] .ic-sun{display:none}
.nav-item.on{color:var(--green-deep);font-weight:600}
.nav-item.on .ni-ico{transform:translateY(-1px) scale(1.08)}
.nav-item .ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px}
.nav-item.on .ni-dot{opacity:1}
/* ============ 待办 ============ */
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.ds-item{
  flex:none;width:52px;min-height:60px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);
}
.ds-item .ds-w{font-size:11px}
.ds-item .ds-d{font-size:16px;font-weight:600;color:var(--text)}
.ds-item.is-today{border-color:var(--green)}
.ds-item.on{background:var(--green-deep);border-color:var(--green-deep)}
.ds-item.on .ds-w,.ds-item.on .ds-d{color:var(--on-green)}
.todo-progress{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.tp-text{font-size:13px;color:var(--text-dim);white-space:nowrap}
.tp-text b{color:var(--green-deep);font-size:14px}
.tp-bar{flex:1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.tp-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item-wrap{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.todo-item{
  display:flex;align-items:center;gap:2px;padding:6px 8px;
  background:var(--card);position:relative;z-index:2;
  touch-action:pan-y;transition:transform .18s ease;
}
.todo-item.swiping{transition:none}
.todo-item.dragging{opacity:.6;box-shadow:var(--shadow-lg);z-index:5;position:relative}
.todo-item.done .td-text{text-decoration:line-through;color:var(--text-faint)}
.todo-swipe{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1}
.tsw-btn{
  width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:#fff;
}
.tsw-btn svg{width:19px;height:19px}
.tsw-edit{background:var(--green)}
.tsw-del{background:var(--danger)}
.swipe-hint{font-size:11.5px;color:var(--text-faint);text-align:right;margin:-4px 4px 8px}
.grip{
  width:38px;height:44px;min-width:38px;display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:13px;letter-spacing:-2px;touch-action:none;cursor:grab;
}
.check{
  width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;
}
.ck-circle{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--on-green);
  transition:all .15s;background:transparent;
}
.check.on .ck-circle{background:var(--green);border-color:var(--green)}
.td-main{flex:1;min-width:0;padding:4px 4px}
.td-text{font-size:14.5px;word-break:break-all;transition:color .15s}
.td-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag-pill{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:500}
.tag-work{background:var(--green-soft);color:var(--green-deep)}
.tag-life{background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 75%,var(--text))}
.due-txt{font-size:11px;color:var(--text-faint)}
.due-txt.soon{color:var(--danger)}
.td-actions{display:flex}
.td-actions .icon-btn{width:44px;min-width:44px;height:44px;min-height:44px;font-size:15px;border:none;background:transparent}
.td-actions .icon-btn.warn{color:var(--danger)}
/* ============ 记账 ============ */
.acct-summary{
  display:flex;align-items:stretch;margin-bottom:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.acct-summary .as-col{flex:1;padding:14px 10px;text-align:center;min-width:0}
.acct-summary .as-col+.as-col{border-left:1px solid var(--line-soft)}
.acct-summary .as-label{font-size:11.5px;color:var(--text-dim);margin-bottom:4px}
.acct-summary .as-val{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-summary .income .as-val{color:var(--income)}
.acct-summary .expense .as-val{color:var(--danger)}
.acct-summary .balance .as-val{color:var(--green-deep)}
.acct-balance{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--green-deep);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;color:var(--on-green);box-shadow:var(--shadow);
}
.acct-balance .ab-label{font-size:13px;opacity:.8}
.acct-balance .ab-val{font-size:26px;font-weight:700;font-family:var(--font-serif);word-break:break-all;text-align:right}
.acct-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.acct-two .at-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 15px}
.at-card .at-label{font-size:11.5px;color:var(--text-dim);margin-bottom:3px}
.at-card .at-val{font-size:19px;font-weight:700;word-break:break-all}
.at-card.income .at-val{color:var(--income)}
.at-card.expense .at-val{color:var(--danger)}
.acct-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.acct-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 12px}
.acct-card .ac-label{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.acct-card .ac-val{font-size:16.5px;font-weight:700;word-break:break-all}
.acct-card.income .ac-val{color:var(--income)}
.acct-card.expense .ac-val{color:var(--danger)}
.acct-card.balance .ac-val{color:var(--green-deep)}
.acct-ops{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.acct-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.acct-day{border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.acct-day-head{display:flex;justify-content:space-between;padding:9px 14px;font-size:12.5px;color:var(--text-dim);background:var(--green-soft);border-bottom:1px solid var(--line-soft)}
.acct-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.acct-row:last-child{border-bottom:none}
.acct-row:active{background:var(--line-soft)}
.ac-ico{width:38px;height:38px;min-width:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--line-soft)}
.ac-ico svg{width:20px;height:20px}
.ac-ico.income{background:var(--income-soft);color:var(--green-deep)}
.ac-ico.expense{background:var(--danger-soft);color:var(--danger)}
.ac-info{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:500}
.ac-note{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-amt{font-size:14.5px;font-weight:700;white-space:nowrap}
.ac-amt.income{color:var(--income)}
.ac-amt.expense{color:var(--danger)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cat-bar-row{display:flex;align-items:center;gap:8px;padding:7px 0}
.cbr-ico{width:26px;min-width:26px;font-size:15px;text-align:center;color:var(--text-dim)}
.cbr-ico svg{width:17px;height:17px}
.cbr-name{width:64px;min-width:64px;font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbr-track{flex:1;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.cbr-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.cbr-fill.expense{background:var(--danger)}
.cbr-fill.income{background:var(--income)}
.cbr-pct{width:38px;min-width:38px;text-align:right;font-size:12px;color:var(--text-dim)}
.cbr-amt{width:66px;min-width:66px;text-align:right;font-size:12px;font-weight:600}
.chart-box{width:100%;overflow-x:auto}
/* ============ 新闻 ============ */
.news-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.news-item{display:block;text-decoration:none;color:inherit;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.news-item:active{background:var(--line-soft)}
.ns-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ns-theme{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--green-soft);color:var(--green-deep);font-weight:600}
.ns-theme.gj{background:var(--mist-soft);color:color-mix(in srgb,var(--mist) 80%,var(--text))}
.ns-title{font-family:var(--font-serif);font-size:16px;font-weight:600;line-height:1.5;margin-bottom:6px}
.ns-sum{font-size:13px;color:var(--text-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.ns-foot{font-size:11.5px;color:var(--text-faint);display:flex;gap:10px}
.ns-dedup{color:var(--apricot)}
/* ============ 学习 ============ */
.study-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.study-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.sc-top{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.sc-platform{font-size:11px;padding:2px 9px;border-radius:8px;font-weight:700;color:var(--on-green)}
.pl-youtube{background:#C0392B}
.pl-tiktok{background:#111;border:1px solid #555}
.pl-douyin{background:#2B2B33}
.pl-xhs{background:#B8554A}
.pl-bilibili{background:#E6878A;color:#fff}
.pl-facebook{background:#3B5B93}
.pl-x{background:#1B1B1F;border:1px solid #444}
.pl-jqz{background:#344F42;color:#fff}
.pl-qbit{background:#3E63B4;color:#fff}
.pl-ithome{background:#E8844A;color:#fff}
.pl-hn{background:#FF6600;color:#fff}
.pl-zhihu{background:#0F88EB;color:#fff}
.pl-weibo{background:#E6162D;color:#fff}
.sc-heat{margin-left:auto;font-size:11.5px;color:var(--text-dim)}
.sc-net{font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 80%,var(--text))}
.sc-title{font-family:var(--font-serif);font-size:15.5px;font-weight:600;line-height:1.5;padding:8px 14px 4px;cursor:pointer;display:block;text-decoration:none;color:inherit}
.sc-title:active{color:var(--green)}
.sc-meta{font-size:11.5px;color:var(--text-faint);padding:0 14px 8px;display:flex;gap:8px;flex-wrap:wrap}
.sc-src-note{margin-left:auto;color:var(--apricot)}
.sc-points{margin:0 14px 10px;padding:9px 12px;border-radius:12px;background:var(--green-soft);font-size:12.5px;line-height:1.75;color:var(--text-dim)}
.sc-points b{color:var(--green-deep);font-weight:700}
.sc-points li{margin-left:16px}
.sc-actions{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line-soft);padding:4px 6px}
.sc-actions .icon-btn{width:44px;min-width:44px;height:44px;min-height:44px;font-size:16px;border:none;background:transparent}
.sc-actions .icon-btn.on-fav{color:var(--apricot)}
.sc-actions .icon-btn.on-watched{color:var(--green)}
.sc-actions .icon-btn.on-later{color:var(--mist)}
.sc-actions .icon-btn.on-fav svg,.sc-actions .icon-btn.on-watched svg,.sc-actions .icon-btn.on-later svg{fill:currentColor}
.sc-go{margin-left:auto;font-size:12.5px;color:var(--green-deep);font-weight:600;padding:0 12px;min-height:44px;display:flex;align-items:center;gap:4px}
/* ============ 专注 ============ */
.focus-summary{background:var(--green-deep);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;color:var(--on-green)}
.fs-label{font-size:12.5px;opacity:.75;margin-bottom:2px}
.fs-val{font-size:30px;font-weight:700;font-family:var(--font-serif)}
.fs-note{font-size:11.5px;opacity:.7;margin-top:3px}
.focus-list{display:flex;flex-direction:column;gap:10px}
.focus-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px}
.focus-card.running{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.fc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fc-name{font-size:15.5px;font-weight:600;font-family:var(--font-serif)}
.fc-goal{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 75%,var(--text))}
.fc-done{margin-left:auto;font-size:12px;color:var(--green);font-weight:700}
.fc-timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 8px;color:var(--green-deep)}
.focus-card.running .fc-timer{font-size:44px;line-height:1.2;margin:6px 0 12px}
.focus-card.running .fc-timer .pulse{width:12px;height:12px}
.fc-timer .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:8px;vertical-align:2px;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.fc-bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-bottom:8px}
.fc-bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.fc-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);margin-bottom:12px}
.fc-stats b{color:var(--text);font-weight:600}
.fc-ctl{display:flex;gap:8px}
.fc-ctl .btn{flex:1}
/* 番茄钟式圆形时钟（浅色底） */
.fc-clock{background:#F4F6F3;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px 16px;text-align:center;margin-bottom:12px}
[data-theme="dark"] .fc-clock{background:color-mix(in srgb,var(--green) 24%,var(--card))}
.fcc-name{font-size:14.5px;font-weight:600;font-family:var(--font-serif);color:var(--green-deep);margin-bottom:4px}
.fcc-ring-wrap{position:relative;width:212px;height:212px;margin:8px auto 4px}
.fcc-ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:9}
.ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .4s}
.fcc-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--green-deep);font-family:var(--font-serif);letter-spacing:1px}
.fcc-label{font-size:12.5px;color:var(--text-dim);margin-bottom:12px}
.fcc-ctl{display:flex;gap:8px}
.fcc-ctl .btn{flex:1}
.fc-pick{margin-bottom:12px}
.focus-card.sel{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green-soft)}
.fc-stats-hint{font-size:10.5px;color:var(--text-faint);margin-left:auto}
.fc-ctl .btn.stop{background:var(--danger);color:#fff}
.fc-ctl .btn.resume{background:var(--green)}
/* ============ 习惯打卡（完整版） ============ */
.privacy-note{font-size:11.5px;color:var(--text-faint);background:var(--line-soft);border-radius:10px;padding:6px 12px;margin-bottom:12px;text-align:center}
.tab-hero{position:relative}
.hero-add{position:absolute;right:2px;top:8px;width:44px;height:44px;border-radius:50%;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.hero-add svg{width:22px;height:22px}
.hb-master{background:var(--green-deep);border-radius:var(--radius);padding:18px;color:var(--on-green);display:flex;align-items:center;gap:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hbm-num{font-family:var(--font-serif);font-size:40px;font-weight:600;line-height:1}
.hbm-num span{font-size:15px;font-weight:400;margin-left:3px}
.hbm-t{font-size:13px;opacity:.85}
.hbm-s{font-size:11.5px;opacity:.7;margin-top:4px}
.hb-weekbar{display:flex;gap:6px;margin-bottom:12px}
.hbwk-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-height:66px}
.hbwk-day.today{background:var(--green-deep);border-color:var(--green-deep)}
.hbwk-day.today .hbwk-w,.hbwk-day.today .hbwk-d{color:var(--on-green)}
.hbwk-day.future{opacity:.45}
.hbwk-day.sel{box-shadow:0 0 0 1.5px var(--green)}
.hbwk-w{font-size:11px;color:var(--text-dim)}
.hbwk-d{font-size:15px;font-weight:600}
.hbwk-n{font-size:10px;color:var(--green);min-height:12px}
.hbwk-n.on{font-weight:700}
.hb-cat{font-size:10.5px;color:var(--text-faint);background:var(--line-soft);padding:2px 8px;border-radius:7px}
.hb-goal{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.hb-prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hb-prog-t{font-size:12.5px;font-weight:600;color:var(--text);min-width:64px}
.hb-prog-bar{flex:1;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.hb-prog-fill{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.hb-section{font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--green-deep);margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between}
.hb-seg{display:flex;background:var(--line-soft);border-radius:10px;padding:2px}
.hb-seg button{min-width:44px;height:32px;border-radius:8px;font-size:12px;color:var(--text-dim);padding:0 10px}
.hb-seg button.on{background:var(--card);color:var(--green-deep);font-weight:600;box-shadow:var(--shadow)}
.hb-month{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.hbm2-row{display:flex;gap:6px;margin-bottom:12px}
.hbm2-item{flex:1;text-align:center;font-size:11px;color:var(--text-dim);line-height:1.5}
.hbm2-item b{display:block;font-size:17px;font-family:var(--font-serif);color:var(--green-deep);font-weight:600}
.hf-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.hf-cell{aspect-ratio:1;border-radius:4px;background:var(--line-soft)}
.hf-cell.l1{background:color-mix(in srgb,var(--green) 30%,var(--green-soft))}
.hf-cell.l2{background:color-mix(in srgb,var(--green) 60%,var(--green-soft))}
.hf-cell.l3{background:var(--green)}
.hf-cell.future{opacity:.25}
.hf-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:10px;color:var(--text-faint)}
.hf-legend .hf-cell{width:11px;height:11px;border-radius:3px}
.hb-stats{display:flex;flex-direction:column;gap:8px}
.hb-stat-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.hbs-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:7px}
.hbs-rate{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hbs-rate b{font-size:14px;min-width:44px}
.hbs-bar{flex:1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.hbs-bar span{display:block;height:100%;background:var(--green);border-radius:3px}
.hbs-meta{font-size:11.5px;color:var(--text-dim)}
.hbs-tone{font-size:11.5px;color:var(--text-faint);margin-top:4px}
.hb-adv{margin:4px 0 10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--line-soft)}
.hb-adv summary{font-size:13px;color:var(--text-dim);padding:10px 0;cursor:pointer;list-style:none}
.hb-adv summary::before{content:'▸ ';color:var(--green)}
.hb-adv[open] summary::before{content:'▾ '}
/* ============ 健康 · 经期跟踪（完整版） ============ */
.hp-main{background:var(--bean-deep);border-radius:var(--radius);padding:20px 18px;color:#fff;margin-bottom:12px;box-shadow:var(--shadow)}
.hpm-days{font-family:var(--font-serif);font-size:44px;font-weight:600;line-height:1}
.hpm-days span{font-size:15px;font-weight:400;margin-left:6px}
.hpm-sub{font-size:13px;opacity:.9;margin-top:6px}
.hpm-line{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin:12px 0 8px}
.hpm-line span{display:block;height:100%;background:rgba(255,255,255,.85);border-radius:3px}
.hpm-meta{font-size:12px;opacity:.85}
.hp-cards{display:flex;gap:10px;margin-bottom:12px}
.hp-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.hp-card.fertile{border-color:var(--mist)}
.hp-card.ov{border-color:var(--lavender)}
.hp-card.luteal{border-color:var(--mist)}
.hpc-label{font-size:12px;color:var(--text-dim);margin-bottom:5px}
.hpc-val{font-size:15.5px;font-weight:600;font-family:var(--font-serif);color:var(--green-deep)}
.hp-card.fertile .hpc-val{color:var(--mist-blue-deep)}
.hp-card.ov .hpc-val{color:var(--lavender)}
.hp-card.luteal .hpc-val{color:var(--mist-blue-deep)}
.hpc-note{font-size:11px;color:var(--text-faint);margin-top:5px}
.hcal-cell.recorded{background:var(--bean);color:#fff;font-weight:600}
.hcal-cell.pred{background:var(--bean-soft);color:var(--bean-deep);font-weight:600;border:1px dashed var(--bean)}
.hcal-cell.fertile{background:var(--mist-soft);color:var(--mist-blue-deep)}
.hcal-cell.ov{background:var(--lavender-soft);color:var(--lavender);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--lavender)}
.hcal-cell.luteal{background:var(--pink-soft);color:var(--bean-deep)}
.hcal-cell.today{box-shadow:inset 0 0 0 1.5px var(--green-deep)}
.hcal-dot{width:4px;height:4px;border-radius:50%;background:var(--apricot);position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}
.hcal-cell{position:relative}
.hcal-legend{display:flex;gap:12px;font-size:10.5px;color:var(--text-dim);margin-top:10px;flex-wrap:wrap}
.hcal-legend .lg{display:flex;align-items:center;gap:5px}
.hcal-legend .lg i{width:11px;height:11px;border-radius:3.5px;display:inline-block}
/* 记录今天弹窗入口 */
.hdr-btn{display:block;width:100%;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;margin-bottom:12px;text-align:left}
.hdr-btn-t{font-size:14.5px;font-weight:600;font-family:var(--font-serif);color:var(--green-deep)}
.hdr-btn-s{display:block;font-size:11.5px;color:var(--text-faint);margin-top:3px}
/* 健康建议卡（按周期阶段：饮食/茶饮/运动 + 理由 + 权威来源） */
.hp-advice{background:linear-gradient(135deg,var(--bean-soft),var(--card));border:1px solid var(--bean-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px}
.hpa-head{font-size:14px;font-weight:600;font-family:var(--font-serif);color:var(--bean-deep);margin-bottom:4px}
.hpa-badge{background:var(--bean);color:#fff;border-radius:8px;padding:2px 9px;font-size:12px;margin-left:2px}
.hpa-intro{font-size:12px;color:var(--text-dim);margin-bottom:10px}
.hpa-item{padding:9px 0;border-top:1px dashed var(--bean-line)}
.hpa-it{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.5}
.hpa-cat{display:inline-block;background:var(--bean);color:#fff;border-radius:7px;font-size:11px;padding:1px 8px;margin-right:7px;vertical-align:1px}
.hpa-why{font-size:12px;color:var(--text-dim);line-height:1.65;margin-top:4px}
.hpa-src{font-size:10.5px;color:var(--text-faint);margin-top:4px}
.hpa-note{font-size:11px;color:var(--text-faint);margin-top:9px;border-top:1px dashed var(--bean-line);padding-top:8px}
.hdr{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.hdr-title{font-family:var(--font-serif);font-size:15.5px;font-weight:600;color:var(--green-deep);margin-bottom:10px}
.hdr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sym-btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--line-soft);font-size:13px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.sym-btn.on{background:var(--bean-soft);border-color:var(--bean);color:var(--bean-deep);font-weight:600}
.sym-lv{font-size:10px;color:var(--bean);font-style:normal}
.hplist{display:flex;flex-direction:column;gap:6px}
.hplist-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 14px;font-size:13px}
.ht-top{display:flex;gap:6px;margin-bottom:6px}
.ht-item{flex:1;text-align:center;font-size:10.5px;color:var(--text-dim);line-height:1.5}
.ht-item b{display:block;font-size:15px;font-family:var(--font-serif);color:var(--bean-deep);font-weight:600}
.hp-tips{margin:6px 0 18px;display:flex;flex-direction:column;gap:8px}
.hpt{font-size:12px;color:var(--text-dim);background:var(--bean-soft);border-radius:12px;padding:10px 12px;line-height:1.7}
/* ============ 习惯卡片与月历基础（复用） ============ */
.habit-list{display:flex;flex-direction:column;gap:10px}
.habit-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px}
.hb-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hb-dot{width:10px;height:10px;border-radius:50%;flex:none}
.hb-name{font-size:15.5px;font-weight:600;font-family:var(--font-serif)}
.hb-streak{font-size:11px;color:var(--text-dim);background:var(--line-soft);padding:2px 9px;border-radius:8px;margin-left:4px}
.hb-edit{margin-left:auto;width:40px;height:44px;min-width:40px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);border:none;background:transparent}
.hb-check{width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--line);color:var(--text-dim);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.hb-check.done{background:var(--green);border-color:var(--green);color:var(--on-green);border-style:solid}
.hb-check:disabled{opacity:.4}
/* 简洁清单式打卡 */
.hb-todayline{font-size:12.5px;color:var(--text-dim);text-align:center;padding:2px 0 12px}
.hb-simple-list{display:flex;flex-direction:column;gap:8px}
.hb-simple{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px 10px 16px}
.hbs-name-btn{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;background:none;border:none;padding:0;min-width:0}
.hbs-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.hbs-n{font-size:15.5px;font-weight:600;font-family:var(--font-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbs-s{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-circle{width:30px;height:30px;min-width:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .15s}
.hb-circle svg{width:14px;height:14px}
.hb-circle.done{background:var(--green);border-color:var(--green);color:var(--on-green)}
.hcal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.hcal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hcal-head .hcal-nav{display:flex;align-items:center;gap:4px}
.hcal-head button{width:40px;height:40px;min-width:40px;border-radius:10px;font-size:15px;color:var(--text-dim)}
.hcal-head .hcal-title{font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--green-deep)}
.hcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hcal-wd{text-align:center;font-size:10.5px;color:var(--text-faint);padding:4px 0}
.hcal-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);position:relative}
.hcal-cell.other{color:var(--text-faint);opacity:.5}
/* ============ 底部弹层/表单 ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(30,34,31,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:51;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  box-shadow:var(--shadow-lg);transition:transform .26s cubic-bezier(.32,.72,.28,1);
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet-title{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:14px;color:var(--green-deep)}
.form-row{margin-bottom:14px}
.form-label{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;display:block}
.form-actions{display:flex;gap:10px;margin-top:18px}
.form-actions .btn{flex:1}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-cell{
  min-height:56px;border-radius:13px;border:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-dim);
}
.cat-cell .cc-ico{font-size:19px;line-height:1}
.cat-cell .cc-ico svg{width:22px;height:22px}
/* 分类图标选择器（简约线条，网格多选） */
.cat-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:220px;overflow-y:auto;padding:2px}

.cat-ico svg{width:22px;height:22px}
.cat-ico.on{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}

/* ============ Toast ============ */
.toast{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));

}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
/* ============================================================
 * 知日 · 个人工作台  —  第一阶段（演示数据 + 本机持久化）
 * 数据层为可替换接口：第二阶段将换为 IndexedDB 适配器
 * ============================================================ */
'use strict';

/* ---------- 工具函数 ---------- */
const pad2 = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const daysAgo = n => new Date(Date.now() - n * 86400000);
const fmtYMD = k => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const fmtW = d => '周' + '日一二三四五六'[d.getDay()];
const fmtWeekday = k => fmtW(parseKey(k));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtMoney = n => '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtHours = ms => (ms / 3600000).toFixed(1) + ' 小时';
const fmtClock = ms => {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? `${h}:${pad2(m)}:${pad2(ss)}` : `${pad2(m)}:${pad2(ss)}`;
};
const fmtHeat = n => n >= 10000 ? (n / 10000).toFixed(n >= 1000000 ? 0 : 1) + '万' : String(n);
const fmtUpdated = iso => {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return Math.floor(diff / 86400000) + '天前';
};
const isToday = k => k === todayKey();

/* ---------- 状态 ---------- */
const state = {
  tab: 'todo',
  todoDate: todayKey(),
  todoFilter: 'all',           // all | work | life
  acctRange: 'month',        // month | year | custom
  acctStart: '', acctEnd: '',
  acctFilter: 'all',         // all | income | expense
  acctGran: 'month',         // day | month | quarter | year
  newsGroup: 'all',          // all | gn | gj
  newsTheme: 'all',
  studyFilter: 'all',        // all | youtube | tiktok | douyin | xhs
  focusPeriod: 'today',      // today | week | month | all
  focusRunning: null,        // 进行中的专注会话（时间戳恢复）
  drag: null,
};

/* ============================================================
 * 外部内容源：复用工作台 GitHub Actions 每日抓取的数据
 * （工作台与知日同域 janehu2026.github.io，前端直接读取）
 * ============================================================ */
const EXT_BASE = 'https://janehu2026.github.io/zhiri/';
const THEME_KW = [
  ['民生', /医保|养老|社保|补贴|菜价|消费品|生活|供水|供电|出行|民生/],
  ['政策', /政策|文件|发布|印发|规定|措施|条例|部署|意见/],
  ['财经', /经济|金融|央行|利率|财政|市场|物价|就业|外贸|增长|关税/],
  ['科技', /科技|AI|人工智能|航天|芯片|机器人|卫星|量子|算力|模型/],
  ['医疗', /医疗|医保|医院|药品|健康|疾病|疫苗|门诊|卫生/],
  ['社会', /社会|社区|改造|救援|通报|服务|保障|志愿者/],
  ['环境', /环境|生态|气候|天气|高温|能源|台风|洪水|污染|排放/],
  ['教育', /教育|学校|学生|高考|教师|教材|课程|大学/],
  ['文化', /文化|电影|作家|艺术|音乐|出版/],
  ['体育', /体育|奥运|足球|比赛|联赛/],
];
function guessTheme(title) {
  for (const [name, re] of THEME_KW) { if (re.test(title)) return name; }
  return '要闻';
}
function dayLabel(day) {
  if (day <= 0) return '今天';
  if (day === 1) return '昨天';
  return day + '天前';
}
function convertNews(n) {
  const out = [];
  const now = new Date();
  (n.items || []).forEach(g => {
    const group = (g.cat === 'gj') ? 'gj' : 'gn';
    (g.items || []).forEach(it => {
      const t = (it.title || '').trim();
      if (!t) return;
      let day = 9;
      if (it.pubDate) {
        const d = new Date(it.pubDate);
        if (!isNaN(d.getTime())) day = Math.max(0, Math.floor((now.getTime() - d.getTime()) / 86400000));
      }
      out.push({
        id: uid('ns'), group, theme: guessTheme(t), title: t,
        source: it.source || '', time: dayLabel(day), url: it.link || '#',
        summary: it.desc || '（点击查看原文）', day,
      });
    });
  });
  out.sort((a, b) => a.day - b.day);
  return { fetchedAt: n.fetchedAt || '08:00', fetchedDate: n.fetchedDate || todayKey(), items: out.slice(0, 40) };
}
function convertStudy(s) {
  const MAP = [
    [/YouTube/i, 'youtube'], [/B站|bilibili/i, 'bilibili'], [/小红书|XHS/i, 'xhs'],
    [/抖音/i, 'douyin'], [/TikTok/i, 'tiktok'], [/Facebook/i, 'facebook'], [/Twitter|\bX\b/i, 'x'],
  ];
  const out = [];
  (s.items || []).forEach(g => {
    let platform = 'douyin';
    for (const [re, p] of MAP) { if (re.test(g.label || '')) { platform = p; break; } }
    (g.items || []).forEach(it => {
      const t = (it.title || '').trim();
      if (!t) return;
      out.push({
        id: uid('sv'), platform, author: it.source || '', title: t,
        duration: it.duration || '—', heat: it.heat || 0,
        updated: new Date((s.fetchedDate || todayKey()) + 'T08:00:00').toISOString(),
        url: it.link || '#', points: [], flags: { fav: false, watched: false, later: false },
      });
    });
  });
  return out.slice(0, 30);
}
async function loadExternalFeed() {
  if (IS_DEMO) return;
  try {
    const [n, s] = await Promise.all([
      fetch(EXT_BASE + 'news.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(EXT_BASE + 'study.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    let changed = false;
    if (n && n.items && n.items.length) {
      // 知日原生格式（group/theme/...）直接用；旧格式走转换
      if (n.items[0].group) {
        data.news = { fetchedAt: n.fetchedAt || '08:00', fetchedDate: n.fetchedDate || todayKey(), items: n.items.slice(0, 40) };
      } else {
        data.news = convertNews(n);
      }
      changed = true;
    }
    if (s && s.items && s.items.length) {
      if (s.items[0].platform) {
        data.study = s.items.slice(0, 30);
        data.studyFetched = s.fetchedAt || '';
      } else {
        data.study = convertStudy(s);
      }
      changed = true;
    }
    if (changed) { if (renderers[state.tab]) renderers[state.tab](); }  // 只更新内存+渲染，不写存储（外部内容不持久化）
  } catch (_) { /* 拉取失败则保留内置快照 */ }
}

/* ---------- 数据层（第一阶段：localStorage，第二阶段换 IndexedDB） ---------- */

/* 旧数据迁移：补齐新字段默认值（升级前的老数据没有 habits/health 新字段） */
function ensureDefaults(d) {
  if (!Array.isArray(d.habits)) d.habits = [];
  d.habits.forEach(h => {
    h.records = h.records || {};
    if (!h.targetType) {
      // 旧版习惯（名称+颜色+records）→ 迁移为新模型
      h.targetType = 'once'; h.target = 1; h.unit = '';
      h.cat = h.cat || 'life';
      h.repeatDays = [1, 2, 3, 4, 5, 6, 7];
      h.startDate = (h.createdAt || '').slice(0, 10) || todayKey();
      h.remindTime = ''; h.allowCatchup = true;
    } else {
      h.cat = h.cat || 'life';
      h.repeatDays = h.repeatDays && h.repeatDays.length ? h.repeatDays : [1, 2, 3, 4, 5, 6, 7];
      h.allowCatchup = h.allowCatchup !== false;
      h.unit = h.unit || '';
    }
  });
  if (!d.health || typeof d.health !== 'object') {
    d.health = { cycleLen: 28, periodLen: 5, lastPeriodStart: '', periods: [] };
  }
  if (!Array.isArray(d.health.periods)) d.health.periods = [];
  if (!d.health.symptoms || typeof d.health.symptoms !== 'object') d.health.symptoms = {};
  return d;
}

/* 同步初始读取（localStorage 即时副本；IndexedDB 由 upgradeStorage 异步接管） */
function loadData() {
  try {

    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.todos && d.transactions) return ensureContent(ensureDefaults(d)); // 直接返回，不做任何清理
    }
  } catch (_) { /* 损坏则重建 */ }

  if (!IS_DEMO) {
    fresh.todos = []; fresh.transactions = []; fresh.focusItems = []; fresh.focusSessions = [];
    fresh.habits = []; fresh.health = { cycleLen: 28, periodLen: 5, lastPeriodStart: '', periods: [] };
    fresh.settings = fresh.settings || {}; fresh.settings.bannerDismissed = true;
    fresh._demo = false;
  } else {
    fresh.settings = fresh.settings || {}; fresh.settings.bannerDismissed = false;
  }
  // 只写 localStorage 副本，不写 IndexedDB —— 避免覆盖 IDB 中可能存在的更完整数据
  // （IndexedDB 由 upgradeStorage 统一接管：有则用之，无则迁入）
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch (_) {}
  return fresh;
}

/* ---------- IndexedDB 持久层（第二阶段：主存储，localStorage 双写副本） ---------- */
const IDB_NAME = 'zhiri_db';
const IDB_STORE = 'kv';
const IDB_KEY = IS_DEMO ? 'main_demo' : 'main';   // 正式版与演示版存储彻底隔离
let _idb = null;
function idbOpen() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => { _idb = req.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}
function idbSet(key, val) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGet(key) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbDel(key) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

/* ---------- 数据层（第二阶段：IndexedDB 主存储 + localStorage 双写副本） ---------- */
function makeSlim(obj) {
  // 新闻/学习是外部内容（云端拉取），不写入本地存储——避免大数组每次全量序列化导致卡顿/超限
  return {
    ...obj,
    news: { fetchedAt: (obj.news && obj.news.fetchedAt) || '', fetchedDate: (obj.news && obj.news.fetchedDate) || '', items: [] },
    study: [],
  };
}
function saveData(d) {
  const obj = d || data;
  const slim = makeSlim(obj);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(slim)); } catch (_) {}
  try { idbSet(IDB_KEY, slim).catch(() => {}); } catch (_) {}
}

/* 本地存储缺失新闻/学习时，用内置快照兜底（随后 loadExternalFeed 拉云端最新） */
function ensureContent(d) {
  if (!d.news || !d.news.items || !d.news.items.length) d.news = buildMock().news;
  if (!d.study || !d.study.length) d.study = buildMock().study;
  return d;
}

/* 启动时异步升级：IndexedDB 与 localStorage 取更完整的一份（防覆盖丢数据），再双写同步 */
async function upgradeStorage() {
  try {
    let idbData = null, lsData = null;
    try {
      const r = localStorage.getItem(STORAGE_KEY);
      if (r) {
        const d = JSON.parse(r);
        if (d && d.todos && d.transactions) lsData = d;
      }
    } catch (_) {}
    try { idbData = await idbGet(IDB_KEY); } catch (_) {}
    const score = d => (d.todos ? d.todos.length : 0) + (d.transactions ? d.transactions.length : 0)
      + (d.focusSessions ? d.focusSessions.length : 0) + (d.habits ? d.habits.length : 0)
      + ((d.health && d.health.periods) ? d.health.periods.length : 0);
    let chosen = null;
    if (idbData && idbData.todos && idbData.transactions && lsData) {
      chosen = score(idbData) >= score(lsData) ? idbData : lsData;   // 取用户数据更完整的一份
    } else if (idbData && idbData.todos && idbData.transactions) {
      chosen = idbData;
    } else if (lsData) {
      chosen = lsData;
    }
    if (chosen) {
      data = ensureContent(ensureDefaults(chosen));
      const slim = makeSlim(data);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(slim)); } catch (_) {}
      try { await idbSet(IDB_KEY, slim); } catch (_) {}
    } else {
      await idbSet(IDB_KEY, makeSlim(ensureContent(ensureDefaults(data))));
    }
  } catch (_) { /* IndexedDB 不可用时继续用 localStorage */ }
  if (renderers[state.tab]) renderers[state.tab]();
}

/* ---------- 待办拖拽排序（Pointer 事件，鼠标/触屏通用） ---------- */
function bindTodoDrag() {
  const list = document.getElementById('todoList');
  if (!list) return;
  const items = () => Array.from(list.querySelectorAll('.todo-item'));
  const grip = e => e.target.closest('.grip');
  list.querySelectorAll('.todo-item').forEach(item => {
    item.addEventListener('pointerdown', e => {
      if (!grip(e)) return;
      e.preventDefault();
      const idx = items().indexOf(item);
      state.drag = { id: item.dataset.id, fromIdx: idx, y: e.clientY, h: item.offsetHeight, moved: false };
      item.classList.add('dragging');
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });
    item.addEventListener('pointermove', e => {
      if (!state.drag || state.drag.id !== item.dataset.id) return;
      const dy = e.clientY - state.drag.y;
      if (Math.abs(dy) > 5) state.drag.moved = true;
      item.style.transform = `translateY(${dy}px)`;
      item.style.zIndex = 5;
    });
    item.addEventListener('pointerup', e => {
      if (!state.drag || state.drag.id !== item.dataset.id) return;
      const fromIdx = state.drag.fromIdx;
      let toIdx = fromIdx;
      items().forEach((other, i) => {
        if (other === item) return;
        const r = other.getBoundingClientRect();
        if (e.clientY > r.top + r.height / 2) toIdx = i;
      });
      state.drag = null;
      item.classList.remove('dragging');
      item.style.transform = ''; item.style.zIndex = '';
      if (toIdx !== fromIdx) {
        const list2 = data.todos.filter(t => t.date === state.todoDate).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const [moved] = list2.splice(fromIdx, 1);
        list2.splice(toIdx, 0, moved);
        list2.forEach((t, i) => t.order = i);
        saveData();
      }
      renderTodo();
    });
    item.addEventListener('pointercancel', () => {
      if (state.drag && state.drag.id === item.dataset.id) {
        state.drag = null; item.classList.remove('dragging');
        item.style.transform = ''; item.style.zIndex = '';
        renderTodo();
      }
    });
  });
}

/* ---------- 待办左滑操作（修改 / 删除） ---------- */
let swipe = null;
function closeSwipe() {
  if (!state.swipeOpenId) return;
  const el = document.querySelector(`.todo-item[data-id="${state.swipeOpenId}"]`);
  if (el) { el.classList.remove('swiping'); el.style.transform = ''; }
  state.swipeOpenId = null;
}
function bindTodoSwipe() {
  const list = document.getElementById('todoList');
  if (!list) return;
  list.querySelectorAll('.todo-item').forEach(item => {
    item.addEventListener('pointerdown', e => {
      if (e.target.closest('.grip')) return; // 拖拽排序由 grip 处理
      if (e.target.closest('.check')) return; // 点击圆圈不动滑动
      const id = item.dataset.id;
      if (state.swipeOpenId && state.swipeOpenId !== id) closeSwipe();
      swipe = { id, x: e.clientX, open: state.swipeOpenId === id, moved: false };
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });
    item.addEventListener('pointermove', e => {
      if (!swipe || swipe.id !== item.dataset.id) return;
      const dx = e.clientX - swipe.x;
      if (Math.abs(dx) > 6) { swipe.moved = true; item.classList.add('swiping'); }
      const base = swipe.open ? -124 : 0;
      const t = Math.max(-124, Math.min(0, base + dx));
      item.style.transform = `translateX(${t}px)`;
    });
    item.addEventListener('pointerup', e => {
      if (!swipe || swipe.id !== item.dataset.id) return;
      const dx = e.clientX - swipe.x;
      const open = swipe.open ? dx < 40 : dx < -40;
      if (open) {
        item.style.transform = 'translateX(-124px)';
        state.swipeOpenId = item.dataset.id;
      } else {
        item.style.transform = '';
        state.swipeOpenId = null;
      }
      item.classList.remove('swiping');
      swipe = null;
    });
    item.addEventListener('pointercancel', () => {
      if (swipe && swipe.id === item.dataset.id) { swipe = null; item.classList.remove('swiping'); item.style.transform = ''; }
    });
  });
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '胡备份_' + todayKey() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  try { localStorage.setItem('zhiri_last_backup', todayKey()); } catch (_) {}
  showToast('备份已导出，请妥善保存该文件');
}
function importBackup(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.todos) || !Array.isArray(d.transactions)) {
        showToast('备份文件格式不正确'); return;
      }
      data = d;
      saveData();
      closeSheet();
      showToast('恢复成功');
      setTimeout(() => location.reload(), 600);
    } catch (_) { showToast('备份文件无法读取'); }
  };
  reader.readAsText(file);
}

function catBars(type) {
  const tx = rangeFiltered().filter(t => t.type === type);
  const rows = {};
  tx.forEach(t => rows[t.catId] = (rows[t.catId] || 0) + t.amount);
  const total = Object.values(rows).reduce((s, v) => s + v, 0);
  const arr = Object.entries(rows).map(([id, amt]) => ({ c: catById(id), amt })).filter(x => x.c).sort((a, b) => b.amt - a.amt);
  if (!arr.length) return `<div class="empty" style="padding:16px 0">暂无${type === 'income' ? '收入' : '支出'}记录</div>`;
  const max = Math.max(...arr.map(x => x.amt), 1);
  const tname = type === 'income' ? '收入' : '支出';
  return `<div style="font-size:12px;color:var(--text-dim);margin:2px 0 6px">${tname}</div>` + arr.slice(0, 8).map(({ c, amt }) => `
    <div class="cat-bar-row">

      <span class="cbr-name">${esc(c.name)}</span>
      <span class="cbr-track"><span class="cbr-fill ${type}" style="width:${(amt / max * 100).toFixed(1)}%"></span></span>
      <span class="cbr-pct">${total ? (amt / total * 100).toFixed(0) : 0}%</span>
      <span class="cbr-amt">${fmtMoney(amt)}</span>
    </div>`).join('');
}

function trendBuckets(gran) {
  const now = new Date(); const out = [];
  if (gran === 'day') {
    for (let i = 13; i >= 0; i--) { const d = daysAgo(i); out.push({ key: dateKey(d), label: `${d.getMonth() + 1}/${d.getDate()}`, full: dateKey(d) }); }
  } else if (gran === 'month') {
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push({ key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, label: `${d.getMonth() + 1}月`, full: null }); }
  } else if (gran === 'quarter') {
    for (let i = 3; i >= 0; i--) { const m = now.getMonth() - i * 3; const d = new Date(now.getFullYear(), m, 1); out.push({ key: `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`, label: `Q${Math.floor(d.getMonth() / 3) + 1}`, full: null }); }
  } else {
    for (let i = 4; i >= 0; i--) { const y = now.getFullYear() - i; out.push({ key: String(y), label: `${y}`, full: null }); }
  }
  return out;
}
function inBucket(t, b) {
  if (b.full) return t.date === b.full;
  if (b.key.includes('Q')) { const [y, q] = b.key.split('-Q'); return t.date.slice(0, 4) === y && Math.floor((+t.date.slice(5, 7) - 1) / 3) + 1 === +q; }
  if (/^\d{4}$/.test(b.key)) return t.date.slice(0, 4) === b.key;
  return t.date.slice(0, 7) === b.key;
}
function fmtAxis(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(n % 100000000 === 0 ? 0 : 1) + '亿';
  if (n >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(Math.round(n));
}
function trendChart() {
  const gran = state.acctGran;
  const buckets = trendBuckets(gran);
  const sums = buckets.map(b => {
    let exp = 0;
    (data.transactions || []).forEach(t => { if (t.type === 'expense' && inBucket(t, b)) exp += t.amount; });
    return exp;
  });
  const max = Math.max(...sums, 1) * 1.15;
  const W = 340, H = 150, padL = 34, padT = 8, padB = 16, plotH = H - padT - padB;
  const plotW = W - padL;
  const step = buckets.length > 1 ? plotW / (buckets.length - 1) : 0;
  const pts = sums.map((v, i) => {
    const x = padL + i * step;
    const y = v > 0 ? H - padB - (v / max * plotH) : H - padB;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const minW = padL + buckets.length * (gran === 'day' ? 24 : 46);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${minW}px" xmlns="http://www.w3.org/2000/svg">`;
  // 网格线 + Y 轴金额刻度
  for (let i = 0; i <= 3; i++) {
    const y = padT + plotH * i / 3;
    const val = max * (1 - i / 3);
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    svg += `<text x="${padL - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">¥${fmtAxis(val)}</text>`;
  }
  svg += `<polygon points="${padL},${H - padB} ${pts} ${W},${H - padB}" fill="var(--danger)" opacity=".08"/>`;
  svg += `<polyline points="${pts}" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  sums.forEach((v, i) => {
    const x = padL + i * step;
    const y = v > 0 ? H - padB - (v / max * plotH) : H - padB;
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--card)" stroke="var(--danger)" stroke-width="2"/>`;
    svg += `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)">${buckets[i].label}</text>`;
  });
  return svg + '</svg>';
}

  return s
    .replace(/\[!--.*?--\][a-zA-Z0-9]{4,20}/g, '')   // 注释 + 紧跟的视频ID

    .replace(/^\s+|\s+$/g, '') || '（点击查看原文）';
}

function sessionsForItem(id) { return (data.focusSessions || []).filter(s => s.itemId === id); }

  const now = new Date();

/* ---------- 计时核心（时间戳计算，与前端定时器无关） ---------- */
function focusActiveMs(r) {
  const start = new Date(r.startedAt).getTime();
  const paused = r.totalPausedMs || 0;
  if (r.pausedAt) return new Date(r.pausedAt).getTime() - start - paused;
  return Date.now() - start - paused;
}
function focusRemainingMs(r) {
  if (r.mode !== 'countdown') return null;
  return Math.max(0, (r.countdownMin * 60000) - focusActiveMs(r));
}

function saveRunning() {
  try {
    if (state.focusRunning) localStorage.setItem(RUNNING_KEY, JSON.stringify(state.focusRunning));
    else localStorage.removeItem(RUNNING_KEY);
  } catch (_) {}
}
function restoreRunning() {
  try {
    const raw = localStorage.getItem(RUNNING_KEY);
    if (!raw) return;

/* ============================================================
 * 页签二：习惯打卡（完整版）
 * 目标类型：once 每日一次 / count 次数 / duration 时长 / qty 数量 / weekly 每周
 * ============================================================ */
const HABIT_CATS = [
  { id: 'health', name: '健康' },
  { id: 'growth', name: '成长' },
  { id: 'life', name: '生活' },
];
const HABIT_COLORS = ['green', 'mist', 'lavender', 'apricot', 'bean'];
const HABIT_COLOR_VAR = { green: 'var(--green)', mist: 'var(--mist)', lavender: 'var(--lavender)', apricot: 'var(--apricot)', bean: 'var(--bean)' };
const HABIT_TYPES = [
  { id: 'once', name: '每日完成一次' },
  { id: 'count', name: '目标次数（如喝 8 杯水）' },
  { id: 'duration', name: '目标时长（如阅读 30 分钟）' },
  { id: 'qty', name: '数量目标（如背 20 个单词）' },
  { id: 'weekly', name: '每周目标（如每周运动 3 次）' },
];
const WEEK_CN = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

/* 习惯当天完成值（number） */
function habitDayVal(h, k) {
  const v = (h.records || {})[k];
  return typeof v === 'number' ? v : (v ? 1 : 0);
}
/* 当天是否完成 */
function habitDayDone(h, k) {
  if (h.targetType === 'weekly') {
    // 本周完成天数
    const wk = weekStart(k);
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = dateKey(addDays(parseKey(wk), i));
      if ((h.records || {})[d]) n++;
    }
    return n >= (h.target || 1);
  }
  return habitDayVal(h, k) >= (h.targetType === 'once' ? 1 : (h.target || 1));
}
/* 当天进度 0~1 */
function habitDayRatio(h, k) {
  const t = h.targetType === 'once' ? 1 : (h.target || 1);
  if (h.targetType === 'weekly') {
    const wk = weekStart(k);
    let n = 0;
    for (let i = 0; i < 7; i++) {
      if ((h.records || {})[dateKey(addDays(parseKey(wk), i))]) n++;
    }
    return Math.min(1, n / t);
  }
  return Math.min(1, habitDayVal(h, k) / t);
}
/* 目标文案 */
function habitGoalText(h) {
  const t = h.target || 1;
  const u = h.unit || '';
  switch (h.targetType) {
    case 'once': return '每日完成一次';
    case 'count': return '每天 ' + t + u;
    case 'duration': return '每天 ' + t + u;
    case 'qty': return '每天 ' + t + u;
    case 'weekly': return '每周 ' + t + ' 次';
  }
  return '';
}
/* 当前连续天数（今天未完成则从昨天数起） */
function habitStreak(h) {
  const rec = h.records || {};
  let d = new Date();
  if (!habitDayDone(h, todayKey())) d = addDays(d, -1);
  let n = 0;
  while (n < 730) {
    if (habitDayDone(h, dateKey(d))) { n++; d = addDays(d, -1); }
    else break;
  }
  return n;
}
/* 历史最长连续 */
function habitMaxStreak(h) {
  const rec = h.records || {};
  const keys = Object.keys(rec).filter(k => habitDayDone(h, k)).sort();
  let best = 0, cur = 0, prev = null;
  keys.forEach(k => {
    if (prev && (parseKey(k) - parseKey(prev)) === 86400000) cur++;
    else cur = 1;
    if (cur > best) best = cur;
    prev = k;
  });
  return best;
}
/* 指定日期是否应打卡（重复日） */
function habitOnDay(h, k) {
  const d = parseKey(k);
  const dow = (d.getDay() + 6) % 7 + 1;   // 1=周一
  const r = h.repeatDays || [1, 2, 3, 4, 5, 6, 7];
  return r.includes(dow);
}
function weekStart(k) {
  const d = parseKey(k);
  const dow = (d.getDay() + 6) % 7;
  return dateKey(addDays(d, -dow));
}

/* ---------- 渲染（简洁清单式 + 一周日期栏） ---------- */

/* ---------- 月度足迹（热力图） ---------- */
function monthFootprint(habits) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const todayD = now.getDate();
  let doneDays = 0, totalPct = 0, dayCnt = 0;
  const perDay = [];
  for (let d = 1; d <= days; d++) {
    const k = dateKey(new Date(y, m, d));
    const active = habits.filter(h => habitOnDay(h, k));
    if (!active.length) { perDay.push(0); continue; }
    const done = active.filter(h => habitDayDone(h, k)).length;
    const ratio = done / active.length;
    perDay.push(d <= todayD ? ratio : -1);
    if (d <= todayD) {
      dayCnt++;
      totalPct += ratio;
      if (ratio >= 1) doneDays++;
    }
  }
  const avgPct = dayCnt ? Math.round(totalPct / dayCnt * 100) : 0;
  const bestHabit = habits.length
    ? habits.reduce((a, b) => (habitStreak(b) > habitStreak(a) ? b : a))
    : null;
  const lv = r => r < 0 ? 'future' : r === 0 ? 'l0' : r < 0.5 ? 'l1' : r < 1 ? 'l2' : 'l3';
  const cells = perDay.map((r, i) => `<span class="hf-cell ${lv(r)}" title="${m + 1}月${i + 1}日"></span>`).join('');
  return `<div class="hb-month">
    <div class="hbm2-row">
      <div class="hbm2-item"><b>${doneDays}</b>天<br>全勤日</div>
      <div class="hbm2-item"><b>${avgPct}%</b><br>本月完成率</div>
      <div class="hbm2-item"><b>${bestHabit ? esc(bestHabit.name) : '—'}</b><br>最稳定习惯</div>
      <div class="hbm2-item"><b>${habits.length ? Math.max(...habits.map(h => habitMaxStreak(h))) : 0}</b>天<br>最长连续</div>
    </div>
    <div class="hf-grid">${cells}</div>
    <div class="hf-legend"><span>少</span><i class="hf-cell l0"></i><i class="hf-cell l1"></i><i class="hf-cell l2"></i><i class="hf-cell l3"></i><span>多</span></div>
  </div>`;
}

/* ---------- 统计视图 ---------- */
function habitStats(habits, view) {
  const now = new Date();
  let start, label;
  if (view === 'week') { start = weekStart(todayKey()); label = '本周'; }
  else if (view === 'month') { start = dateKey(new Date(now.getFullYear(), now.getMonth(), 1)); label = '本月'; }
  else { start = dateKey(addDays(now, -89)); label = '近三月'; }
  if (!habits.length) return `<div class="empty">暂无习惯数据</div>`;
  const rows = habits.map(h => {
    let total = 0, done = 0;
    const dowCnt = [0, 0, 0, 0, 0, 0, 0];
    const d = parseKey(start);
    while (d <= now) {
      const k = dateKey(d);
      if (habitOnDay(h, k)) {
        total++;
        if (habitDayDone(h, k)) { done++; dowCnt[(d.getDay() + 6) % 7]++; }
      }
      d.setDate(d.getDate() + 1);
    }
    const rate = total ? Math.round(done / total * 100) : 0;
    const bestDow = dowCnt.indexOf(Math.max(...dowCnt));
    const dowText = total ? (dowCnt[bestDow] ? '完成集中在' + WEEK_CN[bestDow] : '暂无足够数据') : '暂无足够数据';
    const tone = rate >= 70 ? '还可以慢慢来，这一阶段已经很稳' : rate >= 40 ? '这一周已经完成了大部分目标' : '今天重新开始也很好';
    return `<div class="hb-stat-row">
      <div class="hbs-name"><span class="hb-dot" style="background:${HABIT_COLOR_VAR[h.color] || 'var(--green)'}"></span>${esc(h.name)}</div>
      <div class="hbs-rate"><b>${rate}%</b><span class="hbs-bar"><span style="width:${rate}%"></span></span></div>
      <div class="hbs-meta">连续 ${habitStreak(h)} 天 · 最长 ${habitMaxStreak(h)} 天 · ${dowText}</div>
      <div class="hbs-tone">${tone}</div>
    </div>`;
  }).join('');
  return `<div class="hb-stats">${rows}</div>`;
}

function tapHabit(id) {
  const h = data.habits.find(x => x.id === id);
  if (!h) return;
  const k = state.habitDay || todayKey();
  h.records = h.records || {};
  const v = h.records[k];
  if (h.targetType === 'once' || h.targetType === 'weekly') {
    if (v) delete h.records[k];
    else h.records[k] = true;
  } else {
    const cur = typeof v === 'number' ? v : (v ? 1 : 0);
    const t = h.target || 1;
    if (cur >= t) delete h.records[k];   // 已达成 → 点击清零
    else h.records[k] = cur + 1;
  }
  saveData(); renderHabit();
}

function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtMD(k) { const d = parseKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

function healthCfg() {

  return {

    period: h.periodLen || 5,

}

/* 预测结果（均标注预计） */
function healthPredict() {
  const c = healthCfg();
  if (!c.lastStart) return null;
  const start = parseKey(c.lastStart);
  const nextStart = addDays(start, c.cycle);
  const nextEnd = addDays(nextStart, c.period - 1);
  const ov = addDays(nextStart, -14);
  const fertileS = addDays(ov, -5);
  const fertileE = ov;
  const lutealS = addDays(ov, 1);          // 黄体期：排卵次日开始
  const lutealE = addDays(nextStart, -1);  // 至下次经期前一天
  const today = parseKey(todayKey());
  return {
    cycleDay: Math.max(1, Math.min(c.cycle, daysBetween(start, today) + 1)),  // 负数/越界防护（防历史脏数据）
    daysTo: daysBetween(today, nextStart),
    nextStart: dateKey(nextStart), nextEnd: dateKey(nextEnd),
    ov: dateKey(ov), fertileS: dateKey(fertileS), fertileE: dateKey(fertileE),
    lutealS: dateKey(lutealS), lutealE: dateKey(lutealE),
    progress: Math.min(100, Math.round(daysBetween(start, today) / c.cycle * 100)),
  };
}

  // 月历标记：dateKey -> 'recorded' | 'pred' | 'fertile' | 'ov' | 'luteal'
function healthMarks() {
  const c = healthCfg();
  const marks = {};
  const put = (k, cls, force) => { if (!marks[k] || force) marks[k] = cls; };
  // 已记录经期（实心豆沙红优先）
  c.periods.forEach(p => {
    if (!p.start || !p.end) return;
    let d = parseKey(p.start); const end = parseKey(p.end);
    while (d <= end) { put(dateKey(d), 'recorded'); d = addDays(d, 1); }
  });
  const p = healthPredict();
  if (p) {
    let d = parseKey(p.nextStart);
    for (let i = 0; i < c.period; i++) { put(dateKey(d), 'pred'); d = addDays(d, 1); }
    d = parseKey(p.fertileS);
    const fDays = Math.round((parseKey(p.fertileE) - parseKey(p.fertileS)) / 86400000);
    for (let i = 0; i <= fDays; i++) { put(dateKey(d), 'fertile'); d = addDays(d, 1); }
    put(p.ov, 'ov', true);   // 排卵日优先于易孕期
    d = parseKey(p.lutealS);
    const lDays = Math.round((parseKey(p.lutealE) - parseKey(p.lutealS)) / 86400000);
    for (let i = 0; i <= lDays; i++) { put(dateKey(d), 'luteal'); d = addDays(d, 1); }  // 黄体期（不覆盖已标记）
  }
  return marks;
}

  openSheet(`<div class="sheet-title">${idx >= 0 ? '修改 ' + fmtMD(k) + ' 经期' : '标记 ' + fmtMD(k) + ' 为经期开始'}</div>
    ${lenRow}

      ${idx >= 0 ? `<button class="btn ghost" style="color:var(--danger)" onclick="delPeriod('${k}')">删除记录</button>` : '<button class="btn ghost" onclick="closeSheet()">取消</button>'}
      <button class="btn" onclick="savePeriodLen('${k}')">确定</button>
    </div>`);
}
function pickPeriodLen(n) {
  _pdLen = n;
  document.querySelectorAll('.sheet .chips .chip').forEach(c => c.classList.toggle('on', parseInt(c.textContent) === n));
  const inp = document.getElementById('pdLenInput');
  if (inp) inp.value = n;
}
function savePeriodLen(k) {
  if (k > todayKey()) { showToast('不能标记未来的日期'); return; }   // 防误点未来日期导致预测异常
  const v = parseInt(document.getElementById('pdLenInput').value, 10);
  const len = (v && v >= 1 && v <= 15) ? v : _pdLen;
  const periods = hPeriods();
  const idx = periods.findIndex(p => p.start === k);
  if (idx >= 0) {
    periods[idx].end = dateKey(addDays(parseKey(k), len - 1));
  } else {
    periods.push({ start: k, end: dateKey(addDays(parseKey(k), len - 1)) });
    periods.sort((a, b) => a.start > b.start ? -1 : 1);
    if (!data.health.lastPeriodStart || k > data.health.lastPeriodStart) data.health.lastPeriodStart = k;
  }
  data.health.periods = periods;
  saveData(); closeSheet(); renderHealth();
  showToast('已记录 ' + fmtMD(k) + ' 经期 ' + len + ' 天');
}

}
